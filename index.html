<!DOCTYPE html>
<!-- app version 2.0.0 — one record per absence (start/end by date + AM/PM/Stay-in) with sticky Out; AM/PM/Stay-in in one Parade tab with its own Stay-in order; one-file Backup (Data + History); monthly reason export messages; Data last-day field; employee reordering; date-aware ORD; in-app Guide; Starliner Console style -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#040a24">
<title>Parade State</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0a0e13;
    --panel: #121a22;
    --panel-2: #0d131a;
    --border: #22303d;
    --text: #e8eef4;
    --text-dim: #7c8b99;
    --text-faint: #4d5a66;
    --in: #3ecf8e;
    --out: #f2664a;
    --onduty: #f0b429;
    --leave: #ba8cf2;
    --mc: #5b9cf6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    overscroll-behavior-y: contain;
  }
  input, select, textarea { font-size: 16px; font-family: inherit; }
  #app { max-width: 480px; margin: 0 auto; padding: 10px 12px calc(70px + env(safe-area-inset-bottom, 0px)); }

  .maintabs { display: flex; gap: 6px; margin-bottom: 12px; position: sticky; top: 0; background: var(--bg); padding-top: calc(4px + env(safe-area-inset-top, 0px)); z-index: 5; }
  .maintab {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 9px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; cursor: pointer;
  }
  .maintab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  h2 { font-size: 14px; letter-spacing: 0.03em; margin: 0; }
  .sectionhead { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; }
  .pshead-btns { display: flex; gap: 6px; }
  .refresh-ts { font-size: 9.5px; color: var(--text-faint); text-align: right; margin-top: 2px; }

  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .statblock { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 12px 10px; margin-bottom: 14px; }
  .sb-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
  .sb-main, .sb-out { display: flex; align-items: baseline; gap: 6px; }
  .sb-big { font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .sb-main .sb-big { color: var(--in); }
  .sb-out .sb-big { color: var(--out); }
  .sb-of { font-size: 18px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .sb-cap { font-size: 10px; letter-spacing: 0.1em; color: var(--text-dim); margin-left: 2px; }
  .sb-bar { display: flex; height: 12px; gap: 2px; background: var(--panel-2); margin-bottom: 10px; overflow: hidden; }
  .sb-seg { flex-basis: 0; min-width: 6px; }
  .sb-seg.in { background: var(--in); } .sb-seg.out { background: var(--out); } .sb-seg.onduty { background: var(--onduty); }
  .sb-seg.leave { background: var(--leave); } .sb-seg.mc { background: var(--mc); } .sb-seg.empty { background: var(--border); }
  .sb-cells { display: grid; grid-template-columns: repeat(5, 1fr); }
  .sb-cell { text-align: center; padding: 2px 0; border-left: 1px solid var(--border); min-width: 0; }
  .sb-cell:first-child { border-left: none; }
  .sb-n { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sb-l { font-size: 8.5px; letter-spacing: 0.06em; color: var(--text-dim); white-space: nowrap; }
  .sb-cell.in .sb-n { color: var(--in); } .sb-cell.out .sb-n { color: var(--out); } .sb-cell.onduty .sb-n { color: var(--onduty); }
  .sb-cell.leave .sb-n { color: var(--leave); } .sb-cell.mc .sb-n { color: var(--mc); }
  .statcard { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 10px 8px; text-align: center; }
  .statval { font-size: 19px; font-weight: 600; }
  .statlabel { font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 2px; }
  .statcard.in .statval { color: var(--in); }
  .statcard.out .statval { color: var(--out); }
  .statcard.onduty .statval { color: var(--onduty); }
  .statcard.leave .statval { color: var(--leave); }
  .statcard.mc .statval { color: var(--mc); }
  .statusline { font-size: 12.5px; color: var(--out); margin-bottom: 14px; letter-spacing: 0.02em; }

  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; }
  .btn.full { width: 100%; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 8px 12px; font-size: 11.5px; }
  .btn.danger { background: var(--out); color: #2a0e08; border-color: var(--out); }
  .savebtn.dirty { background: var(--in); color: #06251a; border-color: var(--in); }
  .export-row { margin-bottom: 10px; }

  .segmented { display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 3px; margin-bottom: 10px; gap: 3px; }
  .seg-btn { flex: 1; text-align: center; padding: 9px 4px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--text-dim); cursor: pointer; }
  .seg-btn.active { background: var(--text); color: var(--bg); }
  .seg-btn .count { opacity: 0.7; font-weight: 500; }

  .date-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .date-display { font-size: 12.5px; color: var(--text-dim); }
  .date-row.alt-date .date-display { color: var(--out); }
  .date-badge { font-size: 9px; background: var(--out); color: #2a0e08; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 4px; }

  .selector-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .selector-row label { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.06em; width: 34px; flex-shrink: 0; }
  .selector-row select, .selector-row input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 10px; }
  .selector-static { flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 8px; padding: 9px 10px; font-size: 12.5px; }

  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .press-hint { font-size: 11px; color: var(--out); letter-spacing: 0.02em; margin: -2px 0 12px 2px; }

  .group { margin-bottom: 14px; }
  .group-title { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.08em; margin-bottom: 6px; padding-left: 2px; }
  .emp-grid { display: flex; flex-direction: column; gap: 6px; }
  .empty-hint { color: var(--text-faint); font-size: 12.5px; padding: 20px 4px; text-align: center; }

  .emprow { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--in); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; user-select: none; touch-action: pan-y; cursor: pointer; }
  .emprow.out { border-left-color: var(--out); }
  .emprow.onduty { border-left-color: var(--onduty); }
  .emprow.leave { border-left-color: var(--leave); }
  .emprow.mc { border-left-color: var(--mc); }
  .emprow.excluded { opacity: 0.45; border-left-color: var(--text-faint); }
  .emprow.readonly { cursor: default; }
  .emprow .name { font-size: 13.5px; }
  .emprow .rank { color: var(--text-dim); font-size: 11px; margin-right: 6px; }
  .emprow .badge { font-size: 8.5px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px; padding: 1px 5px; margin-left: 4px; letter-spacing: 0.04em; }
  .badge { display: inline-block; font-size: 9.5px; font-weight: 700; border-radius: 4px; padding: 2px 6px; letter-spacing: 0.04em; border: 1px solid transparent; }
  .badge-cds { background: rgba(91,156,246,0.15); border-color: rgba(91,156,246,0.4); color: #5b9cf6; }
  .badge-stayin { background: rgba(186,140,242,0.15); border-color: rgba(186,140,242,0.4); color: #ba8cf2; }
  .badge-cdo { background: rgba(240,180,41,0.15); border-color: rgba(240,180,41,0.4); color: #f0b429; }
  .badge-ord { background: rgba(138,143,152,0.15); border-color: rgba(138,143,152,0.4); color: #8a8f98; }
  .emprow .substatus { font-size: 11px; color: var(--text-dim); text-align: right; }
  .emprow.out .substatus { color: var(--out); }
  .emprow.onduty .substatus { color: var(--onduty); }
  .emprow.leave .substatus { color: var(--leave); }
  .emprow.mc .substatus { color: var(--mc); }
  .emprow.pressing { background: var(--panel-2); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-sheet { background: var(--panel); border: 1px solid var(--border); border-radius: 14px 14px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 480px; max-height: 86vh; overflow-y: auto; }
  .modal-sheet h3 { margin: 0 0 4px; font-size: 15px; }
  .modal-sheet .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .reason-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
  .reason-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .modal-close { background: transparent; border: none; color: var(--text-dim); width: 100%; text-align: center; padding: 12px; font-size: 12px; letter-spacing: 0.04em; cursor: pointer; }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.06em; margin-bottom: 5px; }
  .field-row input, .field-row select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; }
  .field-row-2 { display: flex; gap: 8px; }
  .field-row-2 .field-row { flex: 1 1 0; min-width: 0; }
  /* Phone date pickers (iOS especially) keep a fixed minimum width unless told
     otherwise, which made side-by-side date boxes spill over their neighbours. */
  input[type=date], input[type=time] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; min-height: 40px; box-sizing: border-box; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .field-row input, .field-row select, .field-row textarea { max-width: 100%; box-sizing: border-box; min-width: 0; }
  .selector-row select, .selector-row input { min-width: 0; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row input[type=checkbox] { width: 18px; height: 18px; }

  .list-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; }
  .list-row .name { font-size: 13px; }
  .list-row .meta { font-size: 10.5px; color: var(--text-faint); }
  .emprow { gap: 10px; }
  .emprow .name { min-width: 0; flex: 1 1 auto; }
  .emprow .statuscol { display: flex; flex-direction: column; align-items: flex-end; text-align: right; min-width: 0; flex: 0 1 58%; }
  .emprow.arrange-row { cursor: default; border-left-color: var(--text-faint); }
  .arrange-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .btn.arrange-on { background: var(--onduty); color: #2a1d00; border-color: var(--onduty); }
  .emprow .subcontext { font-size: 10px; color: var(--text-faint); margin-top: 2px; line-height: 1.3; }

  /* Data tab: one dropdown per employee holding their records for a category */
  .emp-drop { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; overflow: hidden; }
  .emp-drop > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; cursor: pointer; font-size: 13px; }
  .emp-drop > summary::-webkit-details-marker { display: none; }
  .emp-drop > summary::before { content: '\25B8'; color: var(--text-faint); font-size: 11px; margin-right: 2px; transition: transform 0.15s; }
  .emp-drop[open] > summary::before { transform: rotate(90deg); }
  .emp-drop-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emp-drop-count { font-size: 11px; font-weight: 600; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px; min-width: 24px; text-align: center; }
  .emp-drop.is-empty .emp-drop-count { color: var(--text-faint); }
  .emp-drop.is-empty > summary { color: var(--text-dim); }
  .emp-drop-body { border-top: 1px solid var(--border); padding: 6px 8px 8px; }
  .rec-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--border); }
  .rec-row:last-child { border-bottom: none; }
  .rec-main { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
  .rec-reason { font-size: 12px; color: var(--text); word-break: break-word; }
  .rec-tag { font-size: 10.5px; font-weight: 600; color: var(--text-dim); background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .rec-tag-session { color: #5b9cf6; border-color: rgba(91,156,246,0.4); background: rgba(91,156,246,0.12); }
  .rec-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .cover-box { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .cover-title { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
  .cover-line { display: grid; grid-template-columns: 38px minmax(0, 1fr) 96px; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cover-lab { width: 38px; flex-shrink: 0; font-size: 12px; color: var(--text-dim); }
  .cover-line input, .cover-line select { width: 100%; min-width: 0; box-sizing: border-box; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 8px; font-size: 16px; }
  .cover-hint { font-size: 11px; color: var(--text-faint); line-height: 1.4; }
  .rec-empty { font-size: 11.5px; color: var(--text-faint); padding: 6px 4px; }

  .bulk-textarea { width: 100%; min-height: 90px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 16px; padding: 10px; resize: vertical; outline: none; }
  .bulk-list { max-height: 300px; overflow-y: auto; margin-bottom: 6px; }
  .bulk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; }
  .bulk-name { flex: 1 1 100%; font-size: 12.5px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bulk-row select { flex: 1 1 45%; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 7px 8px; min-width: 0; outline: none; }
  .bulk-remove { background: transparent; border: 1px solid var(--border); color: var(--out); border-radius: 6px; width: 30px; height: 30px; flex-shrink: 0; cursor: pointer; font-size: 15px; }

  .datarow { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--in); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .datarow.fp { border-left-color: var(--in); }
  .datarow.lp { border-left-color: var(--mc); }
  .datarow.stayin { border-left-color: var(--leave); }
  .datarow .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .datarow .line2 { font-size: 10.5px; color: var(--text-dim); }
  .check-row { display: flex; gap: 18px; margin-bottom: 16px; flex-wrap: wrap; }
  .check-label { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-dim); }
  .back-link { background: transparent; border: none; color: var(--text-dim); font-size: 12px; padding: 6px 0 14px; cursor: pointer; display: block; }

  .toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--in); color: #06251a; font-size: 12.5px; font-weight: 600; padding: 10px 18px; border-radius: 20px; opacity: 0; transition: all 0.25s ease; z-index: 60; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .export-textarea { width: 100%; min-height: 320px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.5; padding: 10px; white-space: pre; resize: vertical; }

  .maintab-guide { flex: 0 0 38px; font-size: 13px; }
  .backup-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .backup-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .backup-text { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-bottom: 10px; }
  .backup-note { font-size: 11px; color: var(--text-faint); margin-top: 8px; line-height: 1.4; }
  .backup-summary { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-bottom: 10px; }
  .backup-summary b { color: var(--text); }
  .backup-confirm { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 16px; }
  .guide { font-size: 13px; line-height: 1.55; color: var(--text-dim); padding-bottom: 30px; }
  .guide h2 { color: var(--text); margin-bottom: 4px; }
  .guide h3 { color: var(--text); font-size: 13.5px; letter-spacing: 0.02em; margin: 22px 0 8px; scroll-margin-top: 70px; }
  .guide p { margin: 0 0 10px; }
  .guide b { color: var(--text); }
  .guide ul { margin: 0 0 10px; padding-left: 18px; }
  .guide li { margin-bottom: 6px; }
  .guide-lead { color: var(--text-faint); font-size: 12px; }
  .guide-toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
  .guide-toc a { font-size: 11px; color: var(--text-dim); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; text-decoration: none; }
  .guide-dl { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; margin: 0 0 10px; }
  .guide-dl dt { font-size: 11px; font-weight: 700; color: var(--text); letter-spacing: 0.03em; padding-top: 2px; }
  .guide-dl dd { margin: 0; }
  .guide-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; }
  .guide-flow span { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text); font-weight: 600; }
  .guide-flow span + span::before { content: '→ '; color: var(--text-faint); font-weight: 400; }
  .guide-flow span.next { color: var(--text-faint); font-weight: 400; }
  .guide-example { background: var(--panel-2); border: 1px solid var(--border); border-left: 3px solid var(--mc); border-radius: 8px; padding: 8px 11px; font-size: 12px; margin: 0 0 10px; color: var(--text-dim); }
  .guide-table-wrap { overflow-x: auto; margin: 0 0 10px; }
  .guide-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .guide-table th { text-align: left; font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.06em; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .guide-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .guide-table td:first-child { color: var(--text); font-weight: 600; }
  .banner { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 11px; color: var(--text-faint); margin-bottom: 10px; line-height: 1.5; }
/* ================= THEME: STARLINER CONSOLE =================
   A spaceship bridge console: deep navy bezel, backlit coloured keys that
   glow from inside, clipped (chamfered) corners, bright readout panels.
   Fonts (subset to Latin, embedded so they work offline):

:root {
  color-scheme: dark;
  --bg: #040a24;
  --panel: #0c1a4c;          /* console screen */
  --panel-2: #071233;        /* inset screen */
  --border: #24458f;
  --text: #eaf3ff;
  --text-dim: #8fb0e8;
  --text-faint: #5b78b8;
  /* status keys */
  --in: #3dffb0;
  --out: #ff3b4a;
  --onduty: #ffcf3a;
  --leave: #d24bff;
  --mc: #2fe0ff;
  /* console key colours */
  --k-cyan: #2fe0ff;
  --k-blue: #2d6bff;
  --k-mag: #d24bff;
  --k-red: #ff3b4a;
  --k-yel: #ffcf3a;
  --k-grn: #3dffb0;
  --ink: #05103a;            /* dark text on lit keys */
  --rim: inset 0 0 0 1px rgba(110,160,255,0.35);
  --glow-key: inset 0 0 12px rgba(255,255,255,0.55), inset 0 1px 0 rgba(255,255,255,0.7);
  --glow-screen: inset 0 0 0 1px rgba(90,140,255,0.35), inset 0 0 22px rgba(45,107,255,0.28);
  --cut: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  --cut-sm: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
  --cut-lg: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%, 0 14px);
  --font-display: 'PS Display', 'Avant Garde', 'Century Gothic', 'Futura', sans-serif;
  --font-body: 'PS Body', 'Avenir Next', 'Segoe UI', sans-serif;
}
html, body {
  font-family: var(--font-body);
  background:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.55), transparent 60%),
    radial-gradient(1px 1px at 68% 9%, rgba(255,255,255,0.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 84% 31%, rgba(180,220,255,0.5), transparent 60%),
    radial-gradient(1px 1px at 33% 47%, rgba(255,255,255,0.35), transparent 60%),
    radial-gradient(1px 1px at 52% 77%, rgba(255,255,255,0.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 7% 88%, rgba(180,220,255,0.4), transparent 60%),
    radial-gradient(130% 70% at 50% -15%, rgba(45,107,255,0.30), transparent 62%),
    var(--bg);
  background-attachment: fixed;
}
/* no rounded corners anywhere — shapes are cut instead */
.maintab, .btn, .chip, .seg-btn, .segmented, .reason-btn, .statcard, .emprow, .list-row, .datarow, .emp-drop, .emp-drop > summary, .emp-drop-body,
.modal-sheet, .selector-row select, .selector-row input, .selector-static, .field-row input, .field-row select, .cover-line input, .cover-line select,
.export-textarea, textarea, .banner, .cover-box, .backup-card, .backup-summary, .backup-confirm, .toast, .badge, .emprow .badge, .rec-tag, .emp-drop-count,
.date-badge, .guide-toc a, .guide-flow span, .guide-example, .bulk-row, .bulk-row select, .bulk-remove, .bulk-textarea { border-radius: 0 !important; }
.maintab, .btn, .seg-btn, .reason-btn, .emprow, .list-row, .emp-drop > summary, .statcard, .datarow, .toast { clip-path: var(--cut); }
.chip, .badge, .rec-tag, .emp-drop-count, .guide-toc a, .guide-flow span { clip-path: var(--cut-sm); }

.maintab, .btn, .chip, .seg-btn, .reason-btn, h2, .modal-sheet h3, .statlabel, .group-title, .modal-close {
  font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em;
}
/* top bar: console strip */
.maintabs { background: linear-gradient(180deg, #071233 0%, #040a24 100%); padding-bottom: 8px; box-shadow: inset 0 -2px 0 var(--k-blue), 0 6px 18px -6px rgba(45,107,255,0.6); margin-left: -12px; margin-right: -12px; padding-left: 12px; padding-right: 12px; }
.maintab { background: #10225e; color: var(--k-cyan); border: none; box-shadow: var(--rim), inset 0 0 12px rgba(47,224,255,0.18); font-weight: 700; }
.maintab.active { background: linear-gradient(180deg, #8ff1ff 0%, var(--k-cyan) 60%, #18b6e0 100%); color: var(--ink); box-shadow: var(--glow-key); }
/* keys */
.btn { background: linear-gradient(180deg, #5b8dff 0%, var(--k-blue) 55%, #1d4fd0 100%); color: #fff; border: none; box-shadow: var(--glow-key); font-weight: 700; text-shadow: 0 1px 0 rgba(0,20,80,0.4); }
.btn.ghost { background: #10225e; color: var(--k-cyan); box-shadow: var(--rim), inset 0 0 14px rgba(47,224,255,0.22); text-shadow: none; }
.savebtn.dirty { background: linear-gradient(180deg, #a5ffd9 0%, var(--k-grn) 55%, #19c987 100%); color: var(--ink); box-shadow: var(--glow-key); text-shadow: none; }
.btn.danger { background: linear-gradient(180deg, #ff8a93 0%, var(--k-red) 55%, #d01d2c 100%); color: #fff; box-shadow: var(--glow-key); }
.chip { background: #0d2552; color: var(--k-cyan); border: none; box-shadow: var(--rim); font-weight: 700; }
.chip.active { background: linear-gradient(180deg, #ec9bff 0%, var(--k-mag) 60%, #a42fd6 100%); color: #fff; box-shadow: var(--glow-key); }
.reason-btn { background: #10225e; color: var(--text); border: none; box-shadow: var(--rim), inset 0 0 14px rgba(47,224,255,0.16); font-weight: 700; }
.reason-btn:active { background: var(--k-cyan); color: var(--ink); }
/* AM | PM | STAY-IN: segmented console key strip */
.segmented { background: #071233; border: none; padding: 4px; gap: 4px; box-shadow: var(--glow-screen); }
.seg-btn { background: #10225e; color: var(--text-dim); box-shadow: var(--rim); }
.seg-btn.active { background: linear-gradient(180deg, #ffe48a 0%, var(--k-yel) 60%, #e0a915 100%); color: var(--ink); box-shadow: var(--glow-key); }
.seg-btn.active .count { color: var(--ink); opacity: 0.8; }
.date-display { font-family: var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--k-cyan); }
.date-row.alt-date .date-display { color: var(--out); }
/* readout panels: each count is its own backlit panel */
.statgrid { gap: 6px; }
/* single readout panel */
.statblock { border: none; border-radius: 0; clip-path: var(--cut-lg); background: linear-gradient(180deg, #102464 0%, #071233 100%); box-shadow: inset 0 3px 0 var(--k-blue), var(--glow-screen); padding: 14px 14px 12px; }
.sb-big, .sb-n { font-family: var(--font-display); }
.sb-main .sb-big { color: var(--k-grn); }
.sb-out .sb-big { color: var(--k-red); }
.sb-cap, .sb-l { font-family: var(--font-display); color: var(--k-cyan); }
.sb-of { color: var(--text-dim); font-family: var(--font-display); }
.sb-bar { height: 14px; gap: 3px; background: #050d2b; padding: 3px; box-shadow: inset 0 0 0 1px rgba(47,224,255,0.35), inset 0 0 10px rgba(47,224,255,0.2); }
.sb-seg { box-shadow: inset 0 0 5px rgba(255,255,255,0.75); clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%); }
.sb-seg.in { background: var(--k-grn); } .sb-seg.out { background: var(--k-red); } .sb-seg.onduty { background: var(--k-yel); } .sb-seg.leave { background: var(--k-mag); } .sb-seg.mc { background: var(--k-cyan); } .sb-seg.empty { background: #10225e; }
.sb-cell { border-left: 1px solid rgba(90,140,255,0.3); }
.sb-cell.in .sb-n { color: var(--k-grn); } .sb-cell.out .sb-n { color: #ff6a76; } .sb-cell.onduty .sb-n { color: var(--k-yel); } .sb-cell.leave .sb-n { color: #e48bff; } .sb-cell.mc .sb-n { color: var(--k-cyan); }
.statcard { border: none; padding: 10px 8px 8px; text-align: left; box-shadow: var(--glow-key); }
.statcard .statval { font-family: var(--font-display); font-size: 27px; line-height: 1; color: var(--ink) !important; }

<div id="app">
  <nav class="maintabs">
    <button class="maintab active" data-tab="parade">PARADE</button>
    <button class="maintab" data-tab="data">DATA</button>
    <button class="maintab" data-tab="history">HISTORY</button>

  </nav>
  <div id="view">Loading…</div>
</div>
<div id="modalRoot"></div>
<template id="guideTemplate">
<div class="guide">
  <h2>HOW PARADE STATE WORKS</h2>
  <p class="guide-lead">Everything stays on this phone. Nothing is sent anywhere unless you share a backup yourself.</p>

  <nav class="guide-toc">
    <a href="#g-tabs">The tabs</a><a href="#g-day">A day of parades</a><a href="#g-mark">Marking people</a>
    <a href="#g-records">How reasons work</a><a href="#g-rules">Reason rules</a><a href="#g-early">Coming back early</a>
    <a href="#g-data">Data tab</a><a href="#g-history">History</a><a href="#g-backup">Backup</a><a href="#g-habits">Good habits</a>
  </nav>

  <h3 id="g-tabs">The tabs</h3>
  <dl class="guide-dl">
    <dt>PARADE</dt><dd>The chosen date's parades, switched with <b>AM | PM | STAY-IN</b> at the top. Stay-in only lists people marked Stay-in. Tap a person to give a reason or mark them in or out.</dd>
    <dt>DATA</dt><dd>Your master records: sub-units, employees, superiors, and every reason record, grouped per person.</dd>
    <dt>HISTORY</dt><dd>Every parade you've pressed SAVE on, exactly as it was when saved.</dd>
    <dt>BACKUP</dt><dd>Save everything to one file, or restore from one.</dd>
  </dl>

  <h3 id="g-day">A day of parades</h3>
  <p>Each day has three parades, always in this order:</p>
  <div class="guide-flow"><span>AM</span><span>PM</span><span>Stay-in</span><span class="next">next day's AM…</span></div>
  <p>A reason runs from one parade to another along this line. "Picked at PM, then Stay-in" means it shows at PM and again that night at Stay-in.</p>

  <h3 id="g-mark">Marking people</h3>
  <ul>
    <li><b>Pick a reason</b> — tap the person, choose the reason. Reasons with dates (MC, LL, OSL, Course) ask for the number of days, first day and last day; change any one and the others follow (weekdays only).</li>
    <li><b>Mark In</b> — they're present at this parade.</li>
    <li><b>Mark Out</b> — they're out with no particular reason.</li>
    <li><b>ARRANGE</b> (Stay-in only) shows arrows to set the Stay-in order, separate from the Parade order. The Stay-in export follows it.</li>
    <li><b>SAVE</b> stores this parade into History. Do it once the parade is final.</li>
    <li><b>REFRESH</b> re-reads Data and redraws the parade. It never loses anything.</li>
  </ul>
  <p>Every change says in a message at the bottom of the screen exactly what it saved to Data or removed from it.</p>

  <h3 id="g-records">How reasons work</h3>
  <p>Each absence is <b>one record</b> in Data with a <b>From</b> and a <b>To</b>, each a date plus AM, PM or Stay-in:</p>
  <div class="guide-example">PTE Example · <b>3D MC</b> · Mon 20/10 AM → Wed 22/10 Stay-in</div>
  <p>Any parade between From and To shows that reason. That's the only place the reason is stored, so the Parade, Stay-in, Data and exports can't disagree.</p>
  <p><b>Out stays until they're back.</b> When a reason ends, the person shows as <b>Out</b> at every parade after it until someone marks them In or gives them a new reason. Their row says why, e.g. "Out after OFF (Thu 22/10 PM)".</p>
  <p><b>Each parade is separate.</b> Changing someone's reason at PM never touches what they had at AM.</p>
  <p><b>The small grey line</b> under a person's status tells you where they stand: "until Mon 26/10 Stay-in", "last parade of this LL", "Out after RSO (Mon 19/10 AM)", or "from last night's ASA CURRENT".</p>

  <h3 id="g-rules">Reason rules</h3>
  <p>When you pick a reason, its From and To are filled in by these rules. You can always change them in Data.</p>
  <div class="guide-table-wrap"><table class="guide-table">
    <thead><tr><th>Reason</th><th>Picked at</th><th>Then</th></tr></thead>
    <tbody>
      <tr><td>RSO, AM LL, AM OSL, AM MA</td><td>AM</td><td>Out from PM</td></tr>
      <tr><td>PM LL, PM OSL, PM MA</td><td>PM</td><td>Out from Stay-in</td></tr>
      <tr><td>LL, OSL, OFF</td><td>AM</td><td>Same reason at PM, Out at Stay-in</td></tr>
      <tr><td>MC</td><td>AM</td><td>MC at PM and Stay-in</td></tr>
      <tr><td>COURSE, OTHER (typed)</td><td>AM</td><td>Same reason at PM and Stay-in</td></tr>
      <tr><td>ASA / GD OUTGOING</td><td>AM</td><td>Out from PM</td></tr>
      <tr><td>ASA / GD CURRENT</td><td>PM</td><td>Same at Stay-in, then OUTGOING next AM, then Out</td></tr>
      <tr><td>Anything else</td><td>Any</td><td>Out from the next parade</td></tr>
    </tbody>
  </table></div>
  <ul>
    <li><b>Several days</b> (MC, LL, OSL, OFF, Course): the reason shows at every parade inside its dates. LL, OSL and OFF show Out at Stay-in on their last day only.</li>
    <li><b>Leave entered ahead of time</b>: LL, OSL and OFF also show at the Stay-in the night before they start.</li>
    <li><b>MC starting on a Monday</b> also covers Sunday's Stay-in, including one already saved in History.</li>
    <li><b>MC never replaces RSO.</b> If both cover a parade, RSO shows.</li>
  </ul>

  <h3 id="g-early">Coming back early, or a one-off change</h3>
  <p>If you mark someone In (or give a new reason) while a longer reason is still running, you're asked:</p>
  <ul>
    <li><b>End it here</b> — the record stays in Data but now finishes just before this parade. It's labelled "ended early" with the original end date.</li>
    <li><b>Just this parade</b> — only this parade changes; the longer reason carries on afterwards (e.g. back for a medical review, then on MC again).</li>
    <li><b>Remove completely</b> — shown instead of "End it here" when the reason started at this very parade, for undoing a mistake.</li>
  </ul>
  <p>Earlier parades are never changed by this. Someone back early simply stops appearing in later parade messages.</p>

  <h3 id="g-data">Data tab</h3>
  <ul>
    <li><b>MC, Leaves, MA, Offs, Others</b> each list every employee (ORD included) with a dropdown of their records, newest first. Each record shows its From → To.</li>
    <li><b>Adding a record</b>: choose the person, reason and date. For MC, leave and Course, set the days, first day and last day; they keep each other in step. <b>Shows on parade</b> fills in From and To using the rules above; change them if this one is different.</li>
    <li><b>Export message</b> (top of MC, Leaves, MA, Offs, Others) writes a "Personnel on MC"-style message for one month or all months, per person with how many times and each date. Leaves, MA and Others also show which reason.</li>
    <li><b>Search and sub-unit chips</b> narrow every list. Searching a reason's text (e.g. a course name) finds those records.</li>
    <li><b>Order</b>: the arrows on Sub-units and Employees set the order used everywhere, including exports.</li>
    <li><b>ORD</b>: tick ORD and set the date they leave. They still appear on any parade dated before that.</li>
  </ul>

  <h3 id="g-history">History</h3>
  <p>A saved parade is a snapshot. Changing Data later doesn't alter it. You can open, edit or delete saved parades from the History tab. Days from before this version keep exactly what was saved for them.</p>

  <h3 id="g-backup">Backup</h3>
  <ul>
    <li><b>Save</b> makes one file with all Data and all of History.</li>
    <li><b>Restore</b> reads a file and shows what's inside before anything changes. Then choose:
      <ul>
        <li><b>Replace Data + add History</b> — this phone's Data becomes the file's (type REPLACE to confirm). Saved parades missing here are added; ones already here are kept.</li>
        <li><b>Only add missing History</b> — your Data stays untouched.</li>
      </ul>
    </li>
    <li>Older master.json and History files can still be restored.</li>
  </ul>

  <h3 id="g-habits">Good habits</h3>
  <ul>
    <li>SAVE each parade once it's final.</li>
    <li>Enter multi-day reasons when you hear about them, with their real dates. The app handles the parades in between.</li>
    <li>Mark people In when they're back, since Out stays until you do.</li>
    <li>Save a backup weekly, and always before reinstalling or changing phones.</li>
  </ul>
</div>
</template>

<script>
  // ================= CONFIG =================
  var DEFAULT_REASONS = [
    ['MC', 'MC'], ['AM MA', 'Out'], ['PM MA', 'Out'], ['OSL', 'Leave'], ['LL', 'Leave'],
    ['OFF', 'Leave'], ['RSO', 'Out'], ['OOC', 'Out'], ['ASA CURRENT', 'OnDuty'], ['ASA OUTGOING', 'OnDuty'],
    ['GD CURRENT', 'OnDuty'], ['GD OUTGOING', 'OnDuty'],
    ['MEDIC DUTY', 'OnDuty'], ['MED COVER', 'OnDuty'], ['BR COHESION', 'Out'], ['LATE', 'Out'],
    ['SKILLSFUTURE', 'Out'], ['COURSE', 'Out'], ['BR WORK', 'Out'], ['PM LL', 'Leave'],
    ['AM LL', 'Leave'], ['AM OSL', 'Leave'], ['PM OSL', 'Leave'], ['OTHER', 'Out']
  ];
  var REASON_BUCKET = {};
  DEFAULT_REASONS.forEach(function (r) { REASON_BUCKET[r[0]] = r[1]; });
  // Which parades each of these reasons can be picked at. ASA/GD CURRENT is
  // picked at PM or Stay-in; the next morning shows OUTGOING automatically
  // (see stateAt_).
  var SESSION_RESTRICTED_REASONS = {
    'ASA CURRENT': ['PM', 'STAYIN'], 'GD CURRENT': ['PM', 'STAYIN'],
    'ASA OUTGOING': ['AM'], 'GD OUTGOING': ['AM'],
    'AM LL': ['AM', 'STAYIN'], 'AM OSL': ['AM', 'STAYIN'], 'AM MA': ['AM', 'STAYIN']
  };
  var REASONS_WITH_DETAIL = {
    'MC': { type: 'dates' }, 'OSL': { type: 'dates' }, 'LL': { type: 'dates' },
    'OOC': { type: 'text', placeholder: 'Camp/Activity' },
    'COURSE': { type: 'text-dates', placeholder: 'Course name' },
    'OTHER': { type: 'text', placeholder: 'Describe the reason' }
  };
  var BUCKET_LABEL = { In: 'In', Out: 'Out', OnDuty: 'On Duty', Leave: 'Leave', MC: 'MC' };
  var BUCKET_CLASS = { In: 'in', Out: 'out', OnDuty: 'onduty', Leave: 'leave', MC: 'mc' };
  var REASON_CATEGORIES = {
    mc: { listKey: 'mcRecords', label: 'MC' },
    leaves: { listKey: 'leaveRecords', label: 'Leaves' },
    ma: { listKey: 'maRecords', label: 'MA' },
    offs: { listKey: 'offRecords', label: 'Offs' },
    others: { listKey: 'otherRecords', label: 'Others' }
  };
  var REASON_CATEGORY_OF_NAME = {
    'MC': 'mc',
    'OSL': 'leaves', 'LL': 'leaves', 'PM LL': 'leaves', 'AM LL': 'leaves', 'AM OSL': 'leaves', 'PM OSL': 'leaves',
    'AM MA': 'ma', 'PM MA': 'ma',
    'OFF': 'offs',
    'RSO': 'others', 'OOC': 'others', 'ASA CURRENT': 'others', 'ASA OUTGOING': 'others', 'GD CURRENT': 'others', 'GD OUTGOING': 'others', 'MEDIC DUTY': 'others',
    'MED COVER': 'others', 'BR COHESION': 'others', 'LATE': 'others', 'SKILLSFUTURE': 'others',
    'COURSE': 'others', 'BR WORK': 'others', 'OTHER': 'others'
  };
  var EMPLOYEE_RANKS = ['REC', 'PTE', 'LCP', 'CPL', '3SG', '2SG', '1SG', 'SSG', 'MSG', '2LT', 'LTA'];
  var SUPERIOR_RANKS = ['3SG', '2SG', '1SG', 'SSG', 'MSG', '3WO', '2WO', '1WO', 'MWO', 'SWO', '2LT', 'LTA', 'CPT', 'MAJ', 'LTC', 'SLTC', 'COL'];

  var SEED_SUBUNITS = [];
  var SEED_EMPLOYEES = [];
  var SEED_SUPERIORS = [];

  // ================= INDEXEDDB DATA LAYER =================
  var DB_NAME = 'paradeStateApp';
  var DB_VERSION = 3;
  var db = null;

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('subUnits')) d.createObjectStore('subUnits', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('employees')) d.createObjectStore('employees', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('superiors')) d.createObjectStore('superiors', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('attendance')) d.createObjectStore('attendance', { keyPath: 'key' }); // key = date|empId|session
        if (!d.objectStoreNames.contains('dailyDuty')) d.createObjectStore('dailyDuty', { keyPath: 'date' });
        if (!d.objectStoreNames.contains('paradeHistory')) d.createObjectStore('paradeHistory', { keyPath: 'key' }); // key = date|session
        if (!d.objectStoreNames.contains('absenceRecords')) d.createObjectStore('absenceRecords', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('timePresets')) d.createObjectStore('timePresets', { keyPath: 'id' });
      };
      req.onsuccess = function (e) { db = e.target.result; resolve(db); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbGetAll(storeName) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var req = tx.objectStore(storeName).getAll();
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbGet(storeName, key) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var req = tx.objectStore(storeName).get(key);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbBulkPut(storeName, values) {
    return new Promise(function (resolve, reject) {
      if (!values.length) return resolve();
      var tx = db.transaction(storeName, 'readwrite');
      var store = tx.objectStore(storeName);
      values.forEach(function (v) { store.put(v); });
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }
  function idbDelete(storeName, key) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }
  function idbClear(storeName) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).clear();
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }

  // ================= DATE HELPERS (ported exactly) =================
  function todayIso_() {
    var d = new Date();
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function formatDDMMYY_(iso) {
    var parts = iso.split('-');
    if (parts.length !== 3) return '';
    return parts[2] + parts[1] + parts[0].slice(2);
  }
  function ddmmyyToIso_(ddmmyy) {
    if (!/^\d{6}$/.test(ddmmyy)) return '';
    return '20' + ddmmyy.slice(4, 6) + '-' + ddmmyy.slice(2, 4) + '-' + ddmmyy.slice(0, 2);
  }
  function weekdayDatesFrom_(startIso, dayCount) {
    var dates = [];
    var d = new Date(startIso + 'T00:00:00');
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };
    function pushCurrent() { dates.push(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())); }
    pushCurrent();
    var counted = 1;
    while (counted < dayCount) {
      d.setDate(d.getDate() + 1);
      var dow = d.getDay();
      if (dow !== 0 && dow !== 6) { pushCurrent(); counted++; }
    }
    return dates;
  }
  function addWeekdaysIso_(startIso, dayCount) {
    var dates = weekdayDatesFrom_(startIso, dayCount);
    return dates[dates.length - 1];
  }
  function countWeekdaysBetween_(startIso, endIso) {
    var start = new Date(startIso + 'T00:00:00');
    var end = new Date(endIso + 'T00:00:00');
    if (end < start) return 1;
    var count = 1;

  /** ORD is date-aware: someone marked ORD with a date has left from that

  function cdsFieldFor_(sess) { return sess === 'AM' ? 'amCdsEmployeeId' : sess === 'PM' ? 'pmCdsEmployeeId' : 'stayInCdsEmployeeId'; }
  function cdoFieldFor_(sess) { return sess === 'AM' ? 'amCdoSuperiorId' : 'pmCdoSuperiorId'; }

    var r = APP.attendance.filter(function (a) { return a.empId === empId && a.session === sess; })[0];

  // ================= tap / long-press / scroll-vs-tap (shared with Stay-in) =================
  function bindEmpRowEvents_() {
    var MOVE_CANCEL_PX = 10;
    document.querySelectorAll('.emprow').forEach(function (row) {
      var empId = row.getAttribute('data-emp');
      if (row.classList.contains('arrange-row')) return; // arrows only while arranging
      if (row.classList.contains('excluded')) {
        var exStartX = 0, exStartY = 0, exMoved = false;
        row.addEventListener('pointerdown', function (ev) { exStartX = ev.clientX; exStartY = ev.clientY; exMoved = false; });
        row.addEventListener('pointermove', function (ev) {
          if (exMoved) return;
          var dx = ev.clientX - exStartX, dy = ev.clientY - exStartY;
          if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) exMoved = true;
        });
        row.addEventListener('pointerup', function () { if (!exMoved) restoreEmployee_(empId); });
        return;
      }
      var moved = false, startX = 0, startY = 0;
      row.addEventListener('pointerdown', function (ev) {
        moved = false; startX = ev.clientX; startY = ev.clientY;
        row.classList.add('pressing');
      });
      row.addEventListener('pointermove', function (ev) {
        if (moved) return;
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) { moved = true; row.classList.remove('pressing'); }
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evt) {
        row.addEventListener(evt, function () {
          row.classList.remove('pressing');
          if (evt === 'pointerup' && !moved) openReasonModal(empId);
        });
      });
      row.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    });
  }

  function buildSnapshot(sess) {

    var cdoSup = isStayIn ? null : APP.superiors.filter(function (s) { return s.id === APP.dailyDuty[cdoFieldFor_(sess)]; })[0];

      cdo: cdoSup ? (cdoSup.rank + ' ' + cdoSup.name) : '',
      total: total, present: counts.In, people: people
    };

  // ================= ABSENCE ENGINE (one record per absence) =================
  /* How reasons work now:
   *  - Every absence is ONE record with a start and an end, each a date plus
   *    an attendance type (AM / PM / Stay-in). The records in Data are the
   *    only source of truth; what any parade shows is worked out from them.
   *  - Each day has three parades in order: AM, PM, Stay-in. A record
   *    covers every parade from its start to its end, inclusive.
   *  - "Mark In" / "Mark Out" are tiny records of their own, pinned to one
   *    parade.
   *  - When nothing covers a parade, the person shows whatever the most
   *    recent thing before it left them as: present after a Mark In,
   *    otherwise Out (sticky) after any reason ends, until marked present.
   *  - Picking a reason fills in a default start/end from the agreed rules
   *    (defaultSpan_), which can always be edited in Data.
   *  - Parades dated before this model was switched on keep whatever was
   *    saved for them (frozen), so old days never change underneath you. */
  var SESSION_ORDER = ['AM', 'PM', 'STAYIN'];
  var SESSION_SHORT = { AM: 'AM', PM: 'PM', STAYIN: 'Stay-in' };
  var spanModelSince = ''; // ISO date the model was switched on (settings key 'spanModelSince')

  function slotKey_(date, sess) { return date + '|' + SESSION_ORDER.indexOf(sess); }
  function nextSlot_(date, sess) {
    var i = SESSION_ORDER.indexOf(sess);
    return i < 2 ? { date: date, session: SESSION_ORDER[i + 1] } : { date: nextDayIso_(date), session: 'AM' };
  }
  function prevSlot_(date, sess) {
    var i = SESSION_ORDER.indexOf(sess);
    return i > 0 ? { date: date, session: SESSION_ORDER[i - 1] } : { date: previousDayIso_(date), session: 'STAYIN' };
  }
  function spanStartKey_(r) { return slotKey_(r.startDate, r.startSession); }
  function spanEndKey_(r) { return slotKey_(r.endDate, r.endSession); }
  var DOW_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function slotLabel_(date, sess) {
    var d = new Date(date + 'T00:00:00');
    var p = date.split('-');
    return DOW_SHORT[d.getDay()] + ' ' + p[2] + '/' + p[1] + ' ' + SESSION_SHORT[sess];
  }
  function spanLabel_(r) {
    var a = slotLabel_(r.startDate, r.startSession);
    if (spanStartKey_(r) === spanEndKey_(r)) return a;
    return a + ' → ' + slotLabel_(r.endDate, r.endSession);
  }
  function isMarkRecord_(r) { return r && (r.kind === 'in' || r.kind === 'out'); }
  function allSpans_() {
    var out = [];
    Object.keys(REASON_CATEGORIES).forEach(function (c) { (APP[REASON_CATEGORIES[c].listKey] || []).forEach(function (r) { out.push(r); }); });
    return out;
  }
  function spansFor_(empId) { return allSpans_().filter(function (r) { return r.employeeId === empId; }); }
  function marksFor_(empId) { return (APP.marks || []).filter(function (m) { return m.employeeId === empId; }); }

  /** Default start/end for a reason, from the rules agreed for each reason:
   *  - MC: every parade through Stay-in of its last day; an MC starting on a
   *    Monday also covers the Sunday Stay-in before it.
   *  - LL / OSL / OFF: from the Stay-in the night before, through PM of the
   *    last day (that last Stay-in is then Out).
   *  - COURSE / OTHER (typed): through Stay-in of the last day.
   *  - ASA / GD CURRENT: from where it's picked through that night's
   *    Stay-in (the next morning then shows OUTGOING automatically).
   *  - AM MA picked at Stay-in: that Stay-in plus the next AM.
   *  - Everything else: only the parade it's picked at.
   *  pickedDate/pickedSession is the parade it's being picked from (or the
   *  start chosen in Data). When picked live, a default start that would
   *  fall before that parade on the same day is pulled forward to it. */
  function defaultSpan_(reasonName, pickedDate, pickedSession, opts) {
    opts = opts || {};
    var sd = opts.startDate || pickedDate;
    var days = parseInt(opts.days, 10) || 1;
    var last = days > 1 ? addWeekdaysIso_(sd, days) : sd;
    var start = { date: sd, session: pickedSession || 'AM' };
    var end = { date: sd, session: pickedSession || 'AM' };
    if (reasonName === 'MC') {
      start = { date: sd, session: 'AM' };
      if (new Date(sd + 'T00:00:00').getDay() === 1) start = { date: previousDayIso_(sd), session: 'STAYIN' };
      end = { date: last, session: 'STAYIN' };
    } else if (reasonName === 'LL' || reasonName === 'OSL' || reasonName === 'OFF') {
      start = { date: previousDayIso_(sd), session: 'STAYIN' };
      end = { date: last, session: 'PM' };
    } else if (reasonName === 'COURSE' || reasonName === 'OTHER') {
      start = { date: sd, session: sd === pickedDate ? (pickedSession || 'AM') : 'AM' };
      end = { date: last, session: 'STAYIN' };
    } else if (reasonName === 'ASA CURRENT' || reasonName === 'GD CURRENT') {
      start = { date: sd, session: pickedSession === 'STAYIN' ? 'STAYIN' : 'PM' };
      end = { date: sd, session: 'STAYIN' };
    } else if (reasonName === 'AM MA' && pickedSession === 'STAYIN') {
      start = { date: sd, session: 'STAYIN' };
      end = { date: nextDayIso_(sd), session: 'AM' };
    }
    // (MC is exempt: its Monday rule deliberately reaches back to Sunday's Stay-in.)
    if (opts.live && reasonName !== 'MC' && sd === pickedDate && slotKey_(start.date, start.session) < slotKey_(pickedDate, pickedSession)) {
      start = { date: pickedDate, session: pickedSession };
    }
    if (slotKey_(end.date, end.session) < slotKey_(start.date, start.session)) end = { date: start.date, session: start.session };
    return { startDate: start.date, startSession: start.session, endDate: end.date, endSession: end.session };
  }

  /** What one person shows at one parade, worked out from their records.
   *  Returns { status, bucket, reason, context, spanId }. */
  function stateAt_(empId, date, sess) {
    var S = slotKey_(date, sess);
    var spans = spansFor_(empId), marks = marksFor_(empId);
    var active = [];
    spans.forEach(function (r) { if (spanStartKey_(r) <= S && S <= spanEndKey_(r)) active.push({ k: spanStartKey_(r), t: r.createdAt || '', r: r }); });
    marks.forEach(function (m) { if (slotKey_(m.date, m.session) === S) active.push({ k: S, t: m.createdAt || '', r: m }); });
    if (active.length) {
      active.sort(function (a, b) { return a.k < b.k ? 1 : a.k > b.k ? -1 : (a.t < b.t ? 1 : a.t > b.t ? -1 : 0); });
      var top = active[0].r;
      if (!isMarkRecord_(top) && top.reasonName === 'MC') {
        var rso = active.filter(function (x) { return !isMarkRecord_(x.r) && x.r.reasonName === 'RSO'; })[0];
        if (rso) top = rso.r; // an MC never overrides an RSO
      }
      if (top.kind === 'in') return { status: 'In', bucket: 'In', reason: '', context: '' };
      if (top.kind === 'out') return { status: 'Out', bucket: 'Out', reason: '', context: 'Marked out' };
      var bucket = bucketForReasonLocal(top.reasonName);
      var ctx = spanEndKey_(top) > S ? 'until ' + slotLabel_(top.endDate, top.endSession) : (spanStartKey_(top) < S ? 'last parade of this ' + top.reasonName : '');
      return { status: bucket === 'In' ? 'In' : 'Out', bucket: bucket, reason: top.reason, context: ctx, spanId: top.id };
    }
    // Nothing covers this parade: the most recent thing before it decides.
    var sinceKey = spanModelSince ? slotKey_(spanModelSince, 'AM') : '';
    var latest = null, latestKey = '', latestT = '';
    spans.forEach(function (r) {
      var ek = spanEndKey_(r);
      if (ek >= S || (sinceKey && ek < sinceKey)) return;
      if (ek > latestKey || (ek === latestKey && (r.createdAt || '') > latestT)) { latest = r; latestKey = ek; latestT = r.createdAt || ''; }
    });
    marks.forEach(function (m) {
      var mk = slotKey_(m.date, m.session);
      if (mk >= S) return;
      if (mk > latestKey || (mk === latestKey && (m.createdAt || '') > latestT)) { latest = m; latestKey = mk; latestT = m.createdAt || ''; }
    });
    if (!latest || latest.kind === 'in') return { status: 'In', bucket: 'In', reason: '', context: '' };
    if (latest.kind === 'out') return { status: 'Out', bucket: 'Out', reason: '', context: 'Out since ' + slotLabel_(latest.date, latest.session) };
    if ((latest.reasonName === 'ASA CURRENT' || latest.reasonName === 'GD CURRENT') && latest.endSession === 'STAYIN') {
      var nx = nextSlot_(latest.endDate, latest.endSession);
      if (slotKey_(nx.date, nx.session) === S) {
        var outName = latest.reasonName === 'ASA CURRENT' ? 'ASA OUTGOING' : 'GD OUTGOING';
        var ob = bucketForReasonLocal(outName);
        return { status: ob === 'In' ? 'In' : 'Out', bucket: ob, reason: outName, context: 'from last night\'s ' + latest.reasonName };
      }
    }
    return { status: 'Out', bucket: 'Out', reason: '', context: 'Out after ' + latest.reasonName + ' (' + slotLabel_(latest.endDate, latest.endSession) + ')' };
  }

  /** Rebuilds APP.attendance for APP.date from the records. Days before the
   *  model was switched on keep their saved attendance untouched. */
  function recomputeAttendance_() {
    if (spanModelSince && APP.date < spanModelSince) return;
    var rows = [];
    APP.employees.forEach(function (e) {
      SESSION_ORDER.forEach(function (sess) {
        var st = stateAt_(e.id, APP.date, sess);
        rows.push({ date: APP.date, key: APP.date + '|' + e.id + '|' + sess, empId: e.id, session: sess, status: st.status, reason: st.reason, bucket: st.bucket, context: st.context });
      });
    });
    APP.attendance = rows;
  }
  // Kept under its old name: boot, refresh and Change Date all call this.
  function runAutoFillPass_() { recomputeAttendance_(); }

  function listKeyForReason_(reasonName) {
    var cat = REASON_CATEGORY_OF_NAME[reasonName] || 'others';
    return REASON_CATEGORIES[cat].listKey;
  }
  function categoryLabelForReason_(reasonName) {
    return REASON_CATEGORIES[REASON_CATEGORY_OF_NAME[reasonName] || 'others'].label;
  }
  function removeRecordLocal_(rec) {
    if (isMarkRecord_(rec)) { APP.marks = (APP.marks || []).filter(function (m) { return m.id !== rec.id; }); }
    else { var lk = listKeyForReason_(rec.reasonName); APP[lk] = (APP[lk] || []).filter(function (r) { return r.id !== rec.id; }); }
    idbDelete('absenceRecords', rec.id);
  }
  function putRecordLocal_(rec) {
    if (isMarkRecord_(rec)) {
      APP.marks = (APP.marks || []).filter(function (m) { return m.id !== rec.id; }); APP.marks.push(rec);
    } else {
      Object.keys(REASON_CATEGORIES).forEach(function (c) { var lk = REASON_CATEGORIES[c].listKey; APP[lk] = (APP[lk] || []).filter(function (r) { return r.id !== rec.id; }); });
      APP[listKeyForReason_(rec.reasonName)].push(rec);
    }
    idbBulkPut('absenceRecords', [rec]);
  }
  /** MC's Sunday rule also reaches an already-saved Sunday Stay-in in
   *  History, so the saved record matches once a Monday MC is entered. */
  async function applyMcToSavedSunday_(rec) {
    if (rec.reasonName !== 'MC' || rec.startSession !== 'STAYIN') return;
    if (new Date(rec.startDate + 'T00:00:00').getDay() !== 0) return;
    var h = historyList.filter(function (x) { return x.date === rec.startDate && x.session === 'STAYIN'; })[0];
    if (!h || !h.snapshot || !h.snapshot.people) return;
    var p = h.snapshot.people.filter(function (x) { return x.id === rec.employeeId; })[0];
    if (!p || (p.reason === rec.reason && p.bucket === 'MC')) return;
    p.reason = rec.reason; p.bucket = 'MC'; p.status = 'Absent';
    h.snapshot.present = h.snapshot.people.filter(function (x) { return x.bucket === 'In'; }).length;
    try { await idbBulkPut('paradeHistory', [h]); } catch (err) { console.log('[Absence] Sunday MC history update failed:', err); }
  }
  function afterRecordsChanged_(empId) {
    recomputeAttendance_();
    if (empId) dirtyKeys.add(empId + '|' + session);
    render();
  }

  /** The record (if any) that started before this parade and still runs
   *  past it — the one a new pick or Mark In/Out would cut into. */
  function spanRunningThrough_(empId, date, sess) {
    var S = slotKey_(date, sess);
    return spansFor_(empId).filter(function (r) { return spanStartKey_(r) <= S && spanEndKey_(r) > S; })
      .sort(function (a, b) { return spanStartKey_(b) < spanStartKey_(a) ? -1 : 1; })[0] || null;
  }
  /** Clears whatever was set at exactly this parade (marks, and reasons that
   *  started here) — that's what "removing a reason from its own parade"
   *  means. Reasons that started earlier are left alone. */
  function clearAtSlot_(empId, date, sess, keepSpanId) {
    var S = slotKey_(date, sess);
    var removed = [];
    marksFor_(empId).forEach(function (m) { if (slotKey_(m.date, m.session) === S) removeRecordLocal_(m); });
    spansFor_(empId).forEach(function (r) { if (r.id !== keepSpanId && spanStartKey_(r) === S) { removed.push(r); removeRecordLocal_(r); } });
    return removed;
  }
  function endSpanBefore_(rec, date, sess) {
    if (!rec.plannedEndDate) { rec.plannedEndDate = rec.endDate; rec.plannedEndSession = rec.endSession; }
    var p = prevSlot_(date, sess);
    rec.endDate = p.date; rec.endSession = p.session;
    putRecordLocal_(rec);
  }

  /** Choice sheet shown when a new pick or Mark In/Out lands in the middle
   *  of a record that keeps going afterwards. */
  function openSpanChoiceModal_(empId, running, actionLabel, onChoice) {
    var e = APP.employees.filter(function (x) { return x.id === empId; })[0];
    var startsHere = spanStartKey_(running) === slotKey_(APP.date, session);
    var html = '<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">' +
      '<h3>' + esc(e.rank) + ' ' + esc(e.name) + '</h3>' +
      '<div class="sub">On ' + esc(running.reason) + ' · ' + esc(spanLabel_(running)) + '. ' + esc(actionLabel) + ' for ' + esc(SESSION_SHORT[session]) + ':</div>' +
      '<button class="btn full" id="spanChoiceEnd" style="margin-bottom:8px;">' + (startsHere ? 'REMOVE ' + esc(running.reasonName) + ' COMPLETELY' : 'END ' + esc(running.reasonName) + ' HERE') + '</button>' +
      '<button class="btn ghost full" id="spanChoiceOnce" style="margin-bottom:8px;">JUST THIS PARADE</button>' +
      '<div class="sub" style="margin-bottom:10px;">' + (startsHere ? 'Remove deletes the whole record from Data.' : 'End here keeps the record but cuts it off before this parade.') + ' Just this parade leaves the ' + esc(running.reasonName) + ' running afterwards.</div>' +
      '<button class="modal-close" id="modalClose">CANCEL</button></div></div>';
    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('modalOverlay').addEventListener('click', function (ev) { if (ev.target.id === 'modalOverlay') closeModal(); });
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('spanChoiceEnd').addEventListener('click', function () { document.getElementById('modalRoot').innerHTML = ''; onChoice('end'); });
    document.getElementById('spanChoiceOnce').addEventListener('click', function () { document.getElementById('modalRoot').innerHTML = ''; onChoice('once'); });
  }

  /** Picking a reason on Parade / Stay-in. */
  function requestReason_(empId, reasonName, reasonStr, opts) {
    var span = defaultSpan_(reasonName, APP.date, session, { startDate: opts && opts.startDate, days: opts && opts.days, live: true });
    var S = slotKey_(APP.date, session);
    if (!(spanStartKey_(span) <= S && S <= spanEndKey_(span))) {
      // A reason entered ahead of time (e.g. leave starting tomorrow) doesn't
      // touch this parade at all.
      applyReasonPick_(empId, reasonName, reasonStr, opts, null, null, true);
      return;
    }
    var running = spanRunningThrough_(empId, APP.date, session);
    if (running) {
      openSpanChoiceModal_(empId, running, 'Set ' + reasonStr, function (choice) { applyReasonPick_(empId, reasonName, reasonStr, opts, running, choice); });
      return;
    }
    applyReasonPick_(empId, reasonName, reasonStr, opts, null, null);
  }
  function applyReasonPick_(empId, reasonName, reasonStr, opts, running, choice, aheadOnly) {
    var removed = aheadOnly ? [] : clearAtSlot_(empId, APP.date, session, choice === 'once' && running ? running.id : null);
    if (running && choice === 'end') {
      if (spanStartKey_(running) === slotKey_(APP.date, session)) { removeRecordLocal_(running); removed.push(running); }
      else endSpanBefore_(running, APP.date, session);
    }
    var span = defaultSpan_(reasonName, APP.date, session, { startDate: opts && opts.startDate, days: opts && opts.days, live: true });
    var rec = Object.assign({ id: uid_(), employeeId: empId, reasonName: reasonName, reason: reasonStr, firstDate: (opts && opts.startDate) || APP.date, days: (opts && opts.days) || 1, createdAt: new Date().toISOString() }, span);
    putRecordLocal_(rec);
    applyMcToSavedSunday_(rec);
    afterRecordsChanged_(empId);
    var msg = 'Saved to Data › ' + categoryLabelForReason_(reasonName) + ': ' + reasonStr + ' · ' + spanLabel_(rec);
    if (removed.length) msg += ' — replaced ' + removed.map(function (r) { return r.reason; }).join(', ');
    if (running && choice === 'end' && spanStartKey_(running) !== slotKey_(rec.startDate, rec.startSession) && removed.indexOf(running) === -1) msg += ' — ' + running.reasonName + ' now ends ' + slotLabel_(running.endDate, running.endSession);
    showToast(msg);
  }

  /** Mark In / Mark Out on Parade / Stay-in. */
  function requestMark_(empId, status) {
    var running = spanRunningThrough_(empId, APP.date, session);
    if (running) {
      openSpanChoiceModal_(empId, running, status === 'In' ? 'Mark In' : 'Mark Out', function (choice) { applyMark_(empId, status, running, choice); });
      return;
    }
    applyMark_(empId, status, null, null);
  }
  function applyMark_(empId, status, running, choice) {
    var removed = clearAtSlot_(empId, APP.date, session, choice === 'once' && running ? running.id : null);
    var note = '';
    if (running && choice === 'end') {
      if (spanStartKey_(running) === slotKey_(APP.date, session)) { removeRecordLocal_(running); removed.push(running); }
      else { endSpanBefore_(running, APP.date, session); note = running.reasonName + ' now ends ' + slotLabel_(running.endDate, running.endSession); }
    }
    // Only pin a mark if the parade wouldn't already show this without it.
    var st = stateAt_(empId, APP.date, session);
    var needMark = status === 'In' ? st.bucket !== 'In' : !(st.bucket === 'Out' && !st.reason);
    if (needMark) putRecordLocal_({ id: uid_(), kind: status === 'In' ? 'in' : 'out', employeeId: empId, date: APP.date, session: session, createdAt: new Date().toISOString() });
    afterRecordsChanged_(empId);
    var parts = [];
    if (removed.length) parts.push('Removed from Data: ' + removed.map(function (r) { return r.reason; }).join(', '));
    if (note) parts.push(note);
    showToast((status === 'In' ? 'Marked present' : 'Marked out') + ' · ' + SESSION_SHORT[session] + (parts.length ? ' — ' + parts.join(' — ') : ''));
  }

  /** One-time conversion of records saved under the old model (start date +
   *  number of days, no attendance types) into start/end records, using the
   *  same default rules as a fresh pick. */
  function migrateOldRecord_(r) {
    if (isMarkRecord_(r) || r.startSession) return null;
    var sess = r.session || (r.reasonName && r.reasonName.indexOf('PM ') === 0 ? 'PM' : 'AM');
    var span = defaultSpan_(r.reasonName, r.startDate, sess, { startDate: r.startDate, days: r.days });
    var out = Object.assign({ firstDate: r.startDate }, r, span);
    delete out.session;
    return out;
  }

  function checkDateAndProceed_(picked) {

    var label = parts.join(' and ') + (parts.length > 1 ? ' are' : ' is') + ' already saved for this date.';
    dateChangeModal = { open: true, step: 'confirm', pickedDate: picked, conflictInfo: label };

  // ================= STAY-IN STRENGTH =================
  /** Stay-in has its own running order (stayInOrder), separate from the
   *  Parade order, set with ARRANGE on the Stay-in list. People who haven't
   *  been arranged yet follow their usual Parade order, after anyone who has. */
  function stayInSorted_(list) {
    return list.slice().sort(function (a, b) {
      var ka = typeof a.stayInOrder === 'number' ? a.stayInOrder : 1e6 + APP.employees.indexOf(a);
      var kb = typeof b.stayInOrder === 'number' ? b.stayInOrder : 1e6 + APP.employees.indexOf(b);
      return ka - kb;
    });
  }
  /** Moves someone up/down among the Stay-in people of their own sub-unit,
   *  then renumbers every Stay-in person 0..n so the order stays clean. */
  async function moveStayIn_(id, direction) {
    var emp = APP.employees.filter(function (e) { return e.id === id; })[0];
    if (!emp) return;
    var all = stayInSorted_(APP.employees.filter(function (e) { return isTrue(e.isStayIn); }));
    var peers = all.filter(function (e) { return e.subUnit === emp.subUnit; });
    var i = peers.indexOf(emp), j = i + direction;
    if (j < 0 || j >= peers.length) return;
    var other = peers[j];
    var ia = all.indexOf(emp), ib = all.indexOf(other);
    all[ia] = other; all[ib] = emp;
    var changed = [];
    all.forEach(function (e, k) { if (e.stayInOrder !== k) { e.stayInOrder = k; changed.push(e); } });
    try { await idbBulkPut('employees', changed); render(); }
    catch (err) { console.log('[Stay-in] reorder failed:', err); showToast('Reorder failed — ' + (err && err.message ? err.message : 'see console.')); }
  }

      '<button class="btn small ghost" data-si-move="' + esc(e.id) + '" data-dir="1"' + (isLast ? ' disabled style="opacity:0.35;"' : '') + '>&darr;</button></div></div>';
  }

  // ================= EXPORT =================
  function buildExportText_(opts) {
    var timeLabel = opts.timeLabel || (opts.session === 'AM' ? '0745HRS' : '1715HRS');
    var total = opts.people.length;
    var present = opts.people.filter(function (p) { return p.bucket === 'In'; }).length;

    var lines = [];
    lines.push((APP.companyName || '') + ' (Strength as of ' + opts.label + ', ' + formatDDMMYY_(opts.dateIso) + ', ' + timeLabel + ')');
    lines.push('');
    lines.push('CDO -' + (opts.cdo ? ' ' + opts.cdo.toUpperCase() : ''));
    lines.push('CDS -' + (opts.cds ? ' ' + opts.cds.toUpperCase() : ''));
    lines.push('');
    lines.push('Total - ' + total);
    lines.push('Present - ' + present);

    var groups = {}, order = [];
    opts.people.forEach(function (p) {
      var g = p.subUnit || '—';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(p);
    });
    order = sortGroupNamesBySubUnitOrder_(order);

    order.forEach(function (g) {
      var members = groups[g];
      if (!members.length) return;
      var presentCount = members.filter(function (p) { return p.bucket === 'In'; }).length;
      lines.push('');
      lines.push(g + ' - ' + presentCount + '/' + members.length);
      members.forEach(function (p) {
        if (p.bucket === 'In') {
          lines.push(p.rank + ' ' + p.name + ' \u2705');
        } else {
          var reasonText = formatReasonForExport_(p.reason) || BUCKET_LABEL[p.bucket] || p.bucket;
          lines.push(p.rank + ' ' + p.name + ' \u274c (' + reasonText + ')');
        }
      });
    });

    return lines.join('\n');
  }
  function buildStayInExportText_(opts) {
    var total = opts.people.length;
    var present = opts.people.filter(function (p) { return p.bucket === 'In'; }).length;
    var lines = [];
    lines.push(formatDDMMYY_(opts.dateIso) + ' Stay in Strength: ' + present + '/' + total);
    lines.push('');
    lines.push('CDS -' + (opts.cds ? ' ' + opts.cds.toUpperCase() : ''));
    lines.push('');
    opts.people.forEach(function (p, i) {
      if (p.bucket === 'In') lines.push((i + 1) + '. ' + p.rank + ' ' + p.name + ' \u2705');
      else {
        var reasonText = formatReasonForExport_(p.reason) || BUCKET_LABEL[p.bucket] || p.bucket;
        lines.push((i + 1) + '. ' + p.rank + ' ' + p.name + ' \u274c (' + reasonText + ')');
      }
    });
    return lines.join('\n');
  }
  function openExportModal(opts) {

  // ================= REASON EXPORTS (per category, grouped by month) =================
  /* Builds the "PERSONNEL ON MC" style message from Data:
   *   Month Year
   *   RANK NAME - N times (ORD ddmmyy)
   *   1. (ddmmyy) or (ddmmyy-ddmmyy)  [+ (reason) for Leaves and MA]
   * Dates are the reason's own days (first day to last day), the same dates
   * written on the record, and each record is filed under the month of its
   * first day. People follow the Data order (sub-unit, then arranged order). */
  var REASON_EXPORT_TITLE = { mc: 'PERSONNEL ON MC', leaves: 'PERSONNEL ON LEAVES', ma: 'PERSONNEL ON MA', offs: 'PERSONNEL ON OFF', others: 'PERSONNEL ABSENT FOR OTHER REASONS' };
  var REASON_EXPORT_SHOWS_NAME = { leaves: true, ma: true, others: true };
  /** The bracketed type after the date. OTHER shows what was typed for it
   *  (e.g. "Dental") since "OTHER" alone says nothing. */
  function reasonExportType_(rec) {
    if (rec.reasonName === 'OTHER' && rec.reason && rec.reason.indexOf('OTHER ') === 0) return rec.reason.slice(6);
    return rec.reasonName;
  }
  var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function monthLabel_(ym) { var p = ym.split('-'); return MONTH_NAMES[parseInt(p[1], 10) - 1] + ' ' + p[0]; }
  function reasonExportEntries_(catKey) {
    return (APP[REASON_CATEGORIES[catKey].listKey] || []).map(function (r) {
      var first = r.firstDate || r.startDate;
      var days = parseInt(r.days, 10) || 1;
      var last = days > 1 ? addWeekdaysIso_(first, days) : first;
      return { rec: r, first: first, last: last, month: first.slice(0, 7) };
    }).filter(function (x) { return !!x.first; });
  }
  function buildReasonExportText_(catKey, month, subF) {
    var entries = reasonExportEntries_(catKey).filter(function (x) {
      if (month !== 'ALL' && x.month !== month) return false;
      if (subF && subF !== 'ALL') {
        var e = APP.employees.filter(function (y) { return y.id === x.rec.employeeId; })[0];
        if (!e || e.subUnit !== subF) return false;
      }
      return true;
    });
    var lines = [REASON_EXPORT_TITLE[catKey]];
    if (!entries.length) { lines.push(''); lines.push('No records' + (month !== 'ALL' ? ' for ' + monthLabel_(month) : '') + '.'); return lines.join('\n'); }
    var months = entries.map(function (x) { return x.month; }).filter(function (m, i, a) { return a.indexOf(m) === i; }).sort();
    var empOrder = sortPeopleBySubUnitOrder_(APP.employees).map(function (e) { return e.id; });
    var rankOf = function (id) { var i = empOrder.indexOf(id); return i === -1 ? 1e9 : i; };
    months.forEach(function (m) {
      lines.push('');
      lines.push(monthLabel_(m));
      var inMonth = entries.filter(function (x) { return x.month === m; });
      var people = inMonth.map(function (x) { return x.rec.employeeId; }).filter(function (id, i, a) { return a.indexOf(id) === i; });
      people.sort(function (a, b) { return rankOf(a) - rankOf(b); });
      people.forEach(function (empId, pi) {
        var e = APP.employees.filter(function (y) { return y.id === empId; })[0];
        var recs = inMonth.filter(function (x) { return x.rec.employeeId === empId; }).sort(function (a, b) { return a.first < b.first ? -1 : a.first > b.first ? 1 : 0; });
        var who = e ? (e.rank + ' ' + e.name) : '(removed employee)';
        var ord = e && isTrue(e.isORD) && e.ordDate ? ' (ORD ' + formatDDMMYY_(e.ordDate) + ')' : '';
        if (pi > 0) lines.push('');
        lines.push(who + ' - ' + recs.length + (recs.length === 1 ? ' time' : ' times') + ord);
        recs.forEach(function (x, i) {
          var range = x.first === x.last ? formatDDMMYY_(x.first) : formatDDMMYY_(x.first) + '-' + formatDDMMYY_(x.last);
          lines.push((i + 1) + '. (' + range + ')' + (REASON_EXPORT_SHOWS_NAME[catKey] ? ' (' + reasonExportType_(x.rec) + ')' : ''));
        });
      });
    });
    return lines.join('\n');
  }
  function openReasonExportModal_(catKey) {
    var months = reasonExportEntries_(catKey).map(function (x) { return x.month; }).filter(function (m, i, a) { return a.indexOf(m) === i; }).sort().reverse();
    var month = months.indexOf(APP.date.slice(0, 7)) !== -1 ? APP.date.slice(0, 7) : (months[0] || 'ALL');
    var subF = absenceSubFilter[catKey] || 'ALL';
    var html = '<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">' +
      '<h3>Export ' + esc(REASON_CATEGORIES[catKey].label) + '</h3>' +
      '<div class="field-row-2">' +
      '<div class="field-row"><label>Month</label><select id="rxMonth"><option value="ALL"' + (month === 'ALL' ? ' selected' : '') + '>All months</option>' +
      months.map(function (m) { return '<option value="' + m + '"' + (m === month ? ' selected' : '') + '>' + monthLabel_(m) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field-row"><label>Sub-unit</label><select id="rxSub"><option value="ALL">All</option>' +
      APP.subUnits.map(function (su) { return '<option value="' + esc(su.name) + '"' + (su.name === subF ? ' selected' : '') + '>' + esc(su.name) + '</option>'; }).join('') + '</select></div></div>' +
      '<textarea class="export-textarea" id="rxText" readonly></textarea>' +
      '<button class="btn full" id="rxCopy" style="margin:10px 0 8px;">COPY TO CLIPBOARD</button>' +
      '<button class="modal-close" id="modalClose">CLOSE</button></div></div>';
    document.getElementById('modalRoot').innerHTML = html;
    var ta = document.getElementById('rxText'), mSel = document.getElementById('rxMonth'), sSel = document.getElementById('rxSub');
    var refreshText = function () { ta.value = buildReasonExportText_(catKey, mSel.value, sSel.value); };
    refreshText();
    mSel.addEventListener('change', refreshText);
    sSel.addEventListener('change', refreshText);
    ta.addEventListener('click', function () { ta.select(); });
    document.getElementById('modalOverlay').addEventListener('click', function (ev) { if (ev.target.id === 'modalOverlay') closeModal(); });
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('rxCopy').addEventListener('click', function () {
      ta.select();
      try { navigator.clipboard.writeText(ta.value); showToast('Copied.'); } catch (err) { document.execCommand('copy'); showToast('Copied.'); }
    });
  }

  // ================= DATA TAB — roster CRUD =================
  /** Simple case-insensitive substring match used by every Data tab search
   *  box below. An empty query always matches (nothing typed = no filter). */
  function matchesSearch_(haystack, query) {
    if (!query) return true;
    return (haystack || '').toLowerCase().indexOf(query.trim().toLowerCase()) !== -1;
  }
  /** One search input shared by every Data tab list, reading/writing
   *  dataSearch[dataSubTab]. Its id is always "dataSearchInput" — only one
   *  Data sub-tab is ever on screen at a time. Typing into it does NOT
   *  trigger a full render() (see renderDataFilterResults_ / bindUpdateDataEvents):
   *  a full re-render would replace this very input's DOM node on every
   *  keystroke and throw the cursor/focus away, the same flashing problem
   *  already solved for the reason-detail and absence-form date inputs. */
  function dataSearchBarHtml_(placeholder) {
    var val = dataSearch[dataSubTab] || '';
    return '<div class="field-row" style="margin-bottom:10px;"><input type="text" id="dataSearchInput" placeholder="' + esc(placeholder) + '" value="' + esc(val) + '" autocomplete="off"></div>';
  }
  /** Shared by the Employees and Superiors Data tabs — groups a people list
   *  by sub-unit (in configured order, no-sub-unit last), applying an
   *  optional single-sub-unit filter first. rowRenderer draws one person's
   *  row; the group header/wrapper reuses the same classes Parade State's
   *  own employeeGroupsHtml uses for visual consistency. */
  function groupedPeopleHtml_(people, subFilter, rowRenderer, emptyText) {
    var filtered = subFilter === 'ALL' ? people : people.filter(function (p) { return p.subUnit === subFilter; });
    if (!filtered.length) return '<div class="empty-hint">' + esc(emptyText) + '</div>';
    var groups = {}, names = [];
    filtered.forEach(function (p) {
      var g = p.subUnit || '— no sub-unit —';
      if (!groups[g]) { groups[g] = []; names.push(g); }
      groups[g].push(p);
    });
    var orderedNames = sortGroupNamesBySubUnitOrder_(names);
    return orderedNames.map(function (g) {
      return '<div class="group"><div class="group-title">' + esc(g) + '</div>' + groups[g].map(rowRenderer).join('') + '</div>';
    }).join('');
  }

      html += '<div id="dataFilterResults">' + employeesListHtml_() + '</div>';

        APP.subUnits.map(function (s) { return '<button class="chip ' + (superiorSubFilter === s.name ? 'active' : '') + '" data-sup-subfilter="' + esc(s.name) + '">' + esc(s.name) + '</button>'; }).join('') + '</div>';
