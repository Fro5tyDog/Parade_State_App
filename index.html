<!DOCTYPE html>
<!-- app version 1.1.2 — Stay-in Strength live view now grouped by sub-unit (export unaffected, still a flat list) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>Parade State</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0a0e13;
    --panel: #121a22;
    --panel-2: #0d131a;
    --border: #22303d;
    --text: #e8eef4;
    --text-dim: #7c8b99;
    --text-faint: #4d5a66;
    --in: #3ecf8e;
    --out: #f2664a;
    --onduty: #f0b429;
    --leave: #ba8cf2;
    --mc: #5b9cf6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    overscroll-behavior-y: contain;
  }
  input, select, textarea { font-size: 16px; font-family: inherit; }
  #app { max-width: 480px; margin: 0 auto; padding: 10px 12px calc(70px + env(safe-area-inset-bottom, 0px)); }

  .maintabs { display: flex; gap: 6px; margin-bottom: 12px; position: sticky; top: 0; background: var(--bg); padding-top: calc(4px + env(safe-area-inset-top, 0px)); z-index: 5; }
  .maintab {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; padding: 9px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; cursor: pointer;
  }
  .maintab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  h2 { font-size: 14px; letter-spacing: 0.03em; margin: 0; }
  .sectionhead { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; }
  .pshead-btns { display: flex; gap: 6px; }
  .refresh-ts { font-size: 9.5px; color: var(--text-faint); text-align: right; margin-top: 2px; }

  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .statcard { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 10px 8px; text-align: center; }
  .statval { font-size: 19px; font-weight: 600; }
  .statlabel { font-size: 9.5px; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 2px; }
  .statcard.in .statval { color: var(--in); }
  .statcard.out .statval { color: var(--out); }
  .statcard.onduty .statval { color: var(--onduty); }
  .statcard.leave .statval { color: var(--leave); }
  .statcard.mc .statval { color: var(--mc); }
  .statusline { font-size: 12.5px; color: var(--out); margin-bottom: 14px; letter-spacing: 0.02em; }

  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; }
  .btn.full { width: 100%; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 8px 12px; font-size: 11.5px; }
  .btn.danger { background: var(--out); color: #2a0e08; border-color: var(--out); }
  .savebtn.dirty { background: var(--in); color: #06251a; border-color: var(--in); }
  .export-row { margin-bottom: 10px; }

  .segmented { display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 3px; margin-bottom: 10px; gap: 3px; }
  .seg-btn { flex: 1; text-align: center; padding: 9px 4px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--text-dim); cursor: pointer; }
  .seg-btn.active { background: var(--text); color: var(--bg); }
  .seg-btn .count { opacity: 0.7; font-weight: 500; }

  .date-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .date-display { font-size: 12.5px; color: var(--text-dim); }
  .date-row.alt-date .date-display { color: var(--out); }
  .date-badge { font-size: 9px; background: var(--out); color: #2a0e08; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-left: 4px; }

  .selector-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .selector-row label { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.06em; width: 34px; flex-shrink: 0; }
  .selector-row select, .selector-row input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 10px; }
  .selector-static { flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 8px; padding: 9px 10px; font-size: 12.5px; }

  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; cursor: pointer; }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .press-hint { font-size: 11px; color: var(--out); letter-spacing: 0.02em; margin: -2px 0 12px 2px; }

  .group { margin-bottom: 14px; }
  .group-title { font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.08em; margin-bottom: 6px; padding-left: 2px; }
  .emp-grid { display: flex; flex-direction: column; gap: 6px; }
  .empty-hint { color: var(--text-faint); font-size: 12.5px; padding: 20px 4px; text-align: center; }

  .emprow { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--in); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; user-select: none; touch-action: pan-y; cursor: pointer; }
  .emprow.out { border-left-color: var(--out); }
  .emprow.onduty { border-left-color: var(--onduty); }
  .emprow.leave { border-left-color: var(--leave); }
  .emprow.mc { border-left-color: var(--mc); }
  .emprow.excluded { opacity: 0.45; border-left-color: var(--text-faint); }
  .emprow.readonly { cursor: default; }
  .emprow .name { font-size: 13.5px; }
  .emprow .rank { color: var(--text-dim); font-size: 11px; margin-right: 6px; }
  .emprow .badge { font-size: 8.5px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px; padding: 1px 5px; margin-left: 4px; letter-spacing: 0.04em; }
  .badge { display: inline-block; font-size: 9.5px; font-weight: 700; border-radius: 4px; padding: 2px 6px; letter-spacing: 0.04em; border: 1px solid transparent; }
  .badge-cds { background: rgba(91,156,246,0.15); border-color: rgba(91,156,246,0.4); color: #5b9cf6; }
  .badge-stayin { background: rgba(186,140,242,0.15); border-color: rgba(186,140,242,0.4); color: #ba8cf2; }
  .badge-cdo { background: rgba(240,180,41,0.15); border-color: rgba(240,180,41,0.4); color: #f0b429; }
  .badge-ord { background: rgba(138,143,152,0.15); border-color: rgba(138,143,152,0.4); color: #8a8f98; }
  .emprow .substatus { font-size: 11px; color: var(--text-dim); text-align: right; }
  .emprow.out .substatus { color: var(--out); }
  .emprow.onduty .substatus { color: var(--onduty); }
  .emprow.leave .substatus { color: var(--leave); }
  .emprow.mc .substatus { color: var(--mc); }
  .emprow.pressing { background: var(--panel-2); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-sheet { background: var(--panel); border: 1px solid var(--border); border-radius: 14px 14px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 480px; max-height: 86vh; overflow-y: auto; }
  .modal-sheet h3 { margin: 0 0 4px; font-size: 15px; }
  .modal-sheet .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .reason-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 6px; }
  .reason-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .modal-close { background: transparent; border: none; color: var(--text-dim); width: 100%; text-align: center; padding: 12px; font-size: 12px; letter-spacing: 0.04em; cursor: pointer; }
  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.06em; margin-bottom: 5px; }
  .field-row input, .field-row select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; }
  .field-row-2 { display: flex; gap: 8px; }
  .field-row-2 .field-row { flex: 1; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row input[type=checkbox] { width: 18px; height: 18px; }

  .list-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer; }
  .list-row .name { font-size: 13px; }
  .list-row .meta { font-size: 10.5px; color: var(--text-faint); }

  .bulk-textarea { width: 100%; min-height: 90px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 16px; padding: 10px; resize: vertical; outline: none; }
  .bulk-list { max-height: 300px; overflow-y: auto; margin-bottom: 6px; }
  .bulk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; }
  .bulk-name { flex: 1 1 100%; font-size: 12.5px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bulk-row select { flex: 1 1 45%; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 7px 8px; min-width: 0; outline: none; }
  .bulk-remove { background: transparent; border: 1px solid var(--border); color: var(--out); border-radius: 6px; width: 30px; height: 30px; flex-shrink: 0; cursor: pointer; font-size: 15px; }

  .datarow { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--in); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .datarow.fp { border-left-color: var(--in); }
  .datarow.lp { border-left-color: var(--mc); }
  .datarow.stayin { border-left-color: var(--leave); }
  .datarow .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .datarow .line2 { font-size: 10.5px; color: var(--text-dim); }
  .check-row { display: flex; gap: 18px; margin-bottom: 16px; flex-wrap: wrap; }
  .check-label { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-dim); }
  .back-link { background: transparent; border: none; color: var(--text-dim); font-size: 12px; padding: 6px 0 14px; cursor: pointer; display: block; }

  .toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--in); color: #06251a; font-size: 12.5px; font-weight: 600; padding: 10px 18px; border-radius: 20px; opacity: 0; transition: all 0.25s ease; z-index: 60; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .export-textarea { width: 100%; min-height: 320px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.5; padding: 10px; white-space: pre; resize: vertical; }

  .banner { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 11px; color: var(--text-faint); margin-bottom: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <nav class="maintabs">
    <button class="maintab active" data-tab="parade">PARADE</button>
    <button class="maintab" data-tab="stayin">STAY-IN</button>
    <button class="maintab" data-tab="data">DATA</button>
    <button class="maintab" data-tab="history">HISTORY</button>
  </nav>
  <div id="view">Loading…</div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
  // ================= CONFIG =================
  var DEFAULT_REASONS = [
    ['MC', 'MC'], ['AM MA', 'Out'], ['PM MA', 'Out'], ['OSL', 'Leave'], ['LL', 'Leave'],
    ['OFF', 'Leave'], ['RSO', 'Out'], ['OOC', 'Out'], ['ASA CURRENT', 'OnDuty'], ['ASA OUTGOING', 'OnDuty'],
    ['GD CURRENT', 'OnDuty'], ['GD OUTGOING', 'OnDuty'],
    ['MEDIC DUTY', 'OnDuty'], ['MED COVER', 'OnDuty'], ['BR COHESION', 'Out'], ['LATE', 'Out'],
    ['SKILLSFUTURE', 'Out'], ['COURSE', 'Out'], ['BR WORK', 'Out'], ['PM LL', 'Leave'],
    ['AM LL', 'Leave'], ['AM OSL', 'Leave'], ['PM OSL', 'Leave'], ['OTHER', 'Out']
  ];
  var REASON_BUCKET = {};
  DEFAULT_REASONS.forEach(function (r) { REASON_BUCKET[r[0]] = r[1]; });
  // Which sessions each of these two reasons is offered in — CURRENT is used
  // while someone's still actively on duty into the evening (PM/Stay-in),
  // OUTGOING specifically for AM, matching how carryForwardStayInToNextAm_
  // and carryForwardAmToPm_ transform one into the other across sessions.
  var SESSION_RESTRICTED_REASONS = {
    'ASA CURRENT': ['PM', 'STAYIN'], 'GD CURRENT': ['PM', 'STAYIN'],
    'ASA OUTGOING': ['AM'], 'GD OUTGOING': ['AM'],
    'AM LL': ['AM', 'STAYIN'], 'AM OSL': ['AM', 'STAYIN'], 'AM MA': ['AM', 'STAYIN']
  };
  var REASONS_WITH_DETAIL = {
    'MC': { type: 'dates' }, 'OSL': { type: 'dates' }, 'LL': { type: 'dates' },
    'OOC': { type: 'text', placeholder: 'Camp/Activity' },
    'COURSE': { type: 'text-dates', placeholder: 'Course name' },
    'OTHER': { type: 'text', placeholder: 'Describe the reason' }
  };
  var BUCKET_LABEL = { In: 'In', Out: 'Out', OnDuty: 'On Duty', Leave: 'Leave', MC: 'MC' };
  var BUCKET_CLASS = { In: 'in', Out: 'out', OnDuty: 'onduty', Leave: 'leave', MC: 'mc' };
  var REASON_CATEGORIES = {
    mc: { listKey: 'mcRecords', label: 'MC' },
    leaves: { listKey: 'leaveRecords', label: 'Leaves' },
    ma: { listKey: 'maRecords', label: 'MA' },
    offs: { listKey: 'offRecords', label: 'Offs' },
    others: { listKey: 'otherRecords', label: 'Others' }
  };
  var REASON_CATEGORY_OF_NAME = {
    'MC': 'mc',
    'OSL': 'leaves', 'LL': 'leaves', 'PM LL': 'leaves', 'AM LL': 'leaves', 'AM OSL': 'leaves', 'PM OSL': 'leaves',
    'AM MA': 'ma', 'PM MA': 'ma',
    'OFF': 'offs',
    'RSO': 'others', 'OOC': 'others', 'ASA CURRENT': 'others', 'ASA OUTGOING': 'others', 'GD CURRENT': 'others', 'GD OUTGOING': 'others', 'MEDIC DUTY': 'others',
    'MED COVER': 'others', 'BR COHESION': 'others', 'LATE': 'others', 'SKILLSFUTURE': 'others',
    'COURSE': 'others', 'BR WORK': 'others', 'OTHER': 'others'
  };
  var EMPLOYEE_RANKS = ['REC', 'PTE', 'LCP', 'CPL', '3SG', '2SG', '1SG', 'SSG', 'MSG', '2LT', 'LTA'];
  var SUPERIOR_RANKS = ['3SG', '2SG', '1SG', 'SSG', 'MSG', '3WO', '2WO', '1WO', 'MWO', 'SWO', '2LT', 'LTA', 'CPT', 'MAJ', 'LTC', 'SLTC', 'COL'];

  var SEED_SUBUNITS = [];
  var SEED_EMPLOYEES = [];
  var SEED_SUPERIORS = [];

  // ================= INDEXEDDB DATA LAYER =================
  var DB_NAME = 'paradeStateApp';
  var DB_VERSION = 3;
  var db = null;

  function openDB() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains('subUnits')) d.createObjectStore('subUnits', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('employees')) d.createObjectStore('employees', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('superiors')) d.createObjectStore('superiors', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('attendance')) d.createObjectStore('attendance', { keyPath: 'key' }); // key = date|empId|session
        if (!d.objectStoreNames.contains('dailyDuty')) d.createObjectStore('dailyDuty', { keyPath: 'date' });
        if (!d.objectStoreNames.contains('paradeHistory')) d.createObjectStore('paradeHistory', { keyPath: 'key' }); // key = date|session
        if (!d.objectStoreNames.contains('absenceRecords')) d.createObjectStore('absenceRecords', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
        if (!d.objectStoreNames.contains('timePresets')) d.createObjectStore('timePresets', { keyPath: 'id' });
      };
      req.onsuccess = function (e) { db = e.target.result; resolve(db); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbGetAll(storeName) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var req = tx.objectStore(storeName).getAll();
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbGet(storeName, key) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var req = tx.objectStore(storeName).get(key);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function (e) { reject(e); };
    });
  }
  function idbBulkPut(storeName, values) {
    return new Promise(function (resolve, reject) {
      if (!values.length) return resolve();
      var tx = db.transaction(storeName, 'readwrite');
      var store = tx.objectStore(storeName);
      values.forEach(function (v) { store.put(v); });
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }
  function idbDelete(storeName, key) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }
  function idbClear(storeName) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).clear();
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function (e) { reject(e); };
    });
  }

  // ================= DATE HELPERS (ported exactly) =================
  function todayIso_() {
    var d = new Date();
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function formatDDMMYY_(iso) {
    var parts = iso.split('-');
    if (parts.length !== 3) return '';
    return parts[2] + parts[1] + parts[0].slice(2);
  }
  function ddmmyyToIso_(ddmmyy) {
    if (!/^\d{6}$/.test(ddmmyy)) return '';
    return '20' + ddmmyy.slice(4, 6) + '-' + ddmmyy.slice(2, 4) + '-' + ddmmyy.slice(0, 2);
  }
  function weekdayDatesFrom_(startIso, dayCount) {
    var dates = [];
    var d = new Date(startIso + 'T00:00:00');
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };
    function pushCurrent() { dates.push(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())); }
    pushCurrent();
    var counted = 1;
    while (counted < dayCount) {
      d.setDate(d.getDate() + 1);
      var dow = d.getDay();
      if (dow !== 0 && dow !== 6) { pushCurrent(); counted++; }
    }
    return dates;
  }
  function addWeekdaysIso_(startIso, dayCount) {
    var dates = weekdayDatesFrom_(startIso, dayCount);
    return dates[dates.length - 1];
  }
  function countWeekdaysBetween_(startIso, endIso) {
    var start = new Date(startIso + 'T00:00:00');
    var end = new Date(endIso + 'T00:00:00');
    if (end < start) return 1;
    var count = 1;
    var d = new Date(start);
    while (d < end) {
      d.setDate(d.getDate() + 1);
      var dow = d.getDay();
      if (dow !== 0 && dow !== 6) count++;
    }
    return count;
  }
  /** Keeps {days, startDate, endDate} internally consistent regardless of
   *  which one the user just edited — pick either direction: set Days and
   *  the end date follows, or set an End date directly and Days follows.
   *  Returns the updated {days, startDate, endDate}. Editing 'end' snaps the
   *  result back through addWeekdaysIso_ so the stored end date always lands
   *  on a real weekday boundary consistent with the day count — typing a
   *  Saturday, say, resolves to whichever weekday actually completes that
   *  many working days from the start. */
  function reconcileDateRange_(state, changedField) {
    var days = state.days, startDate = state.startDate, endDate = state.endDate;
    if (changedField === 'end') {
      if (startDate && endDate) {
        days = countWeekdaysBetween_(startDate, endDate);
        endDate = addWeekdaysIso_(startDate, days);
      }
    } else {
      // 'days' or 'start' changed — end date follows, keeping the duration fixed
      endDate = startDate ? addWeekdaysIso_(startDate, days) : '';
    }
    return { days: days, startDate: startDate, endDate: endDate };
  }
  function previousDayIso_(iso) {
    var d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    var pad = function (v) { return (v < 10 ? '0' : '') + v; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function nextDayIso_(iso) {
    var d = new Date(iso + 'T00:00:00');

  // ================= tap / long-press / scroll-vs-tap (shared with Stay-in) =================
  function bindEmpRowEvents_() {
    var MOVE_CANCEL_PX = 10;
    document.querySelectorAll('.emprow').forEach(function (row) {
      var empId = row.getAttribute('data-emp');
      if (row.classList.contains('excluded')) {
        var exStartX = 0, exStartY = 0, exMoved = false;
        row.addEventListener('pointerdown', function (ev) { exStartX = ev.clientX; exStartY = ev.clientY; exMoved = false; });
        row.addEventListener('pointermove', function (ev) {
          if (exMoved) return;
          var dx = ev.clientX - exStartX, dy = ev.clientY - exStartY;
          if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) exMoved = true;
        });
        row.addEventListener('pointerup', function () { if (!exMoved) restoreEmployee_(empId); });
        return;
      }
      var moved = false, startX = 0, startY = 0;
      row.addEventListener('pointerdown', function (ev) {
        moved = false; startX = ev.clientX; startY = ev.clientY;
        row.classList.add('pressing');
      });
      row.addEventListener('pointermove', function (ev) {
        if (moved) return;
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) { moved = true; row.classList.remove('pressing'); }
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evt) {
        row.addEventListener(evt, function () {
          row.classList.remove('pressing');
          if (evt === 'pointerup' && !moved) openReasonModal(empId);

      });
      row.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    });

  function buildSnapshot(sess) {

    });

    return {

      cdo: cdoSup ? (cdoSup.rank + ' ' + cdoSup.name) : '',

  async function saveChanges() {

    });
    if (attendanceRows.length) await idbBulkPut('attendance', attendanceRows);
    if (dailyDutyDirty) await idbBulkPut('dailyDuty', [Object.assign({ date: APP.date }, APP.dailyDuty)]);

    var snap = buildSnapshot(session);
    var historyRow = { key: APP.date + '|' + session, date: APP.date, session: session, snapshot: snap, savedAt: new Date().toISOString() };
    await idbBulkPut('paradeHistory', [historyRow]);
    var idx = historyList.findIndex(function (h) { return h.key === historyRow.key; });
    if (idx >= 0) historyList[idx] = historyRow; else historyList.push(historyRow);

  async function refresh() {
    APP.subUnits = await idbGetAll('subUnits');
    APP.employees = await idbGetAll('employees');
    APP.superiors = await idbGetAll('superiors');
    var pulled = 0;
    if (mainTab === 'stayin') {
      pulled = pullBackAbsenceRecords_('STAYIN');
      stayInLastRefreshed = new Date();
    } else {
      pulled += pullBackAbsenceRecords_('AM');
      pulled += pullBackAbsenceRecords_('PM');
      lastRefreshed = new Date();
    }
    runAutoFillPass_(); // always — this is what gives MC its "always refreshed on every type" behavior, with the RSO exception
    if (pulled) showToast('Pulled back ' + pulled + ' record(s) from Data.');
    render();

  // ================= CARRY-FORWARD / AUTO-FILL =================
  /** REFRESH's "pull back" — since deliberately marking someone In/Out no
   *  longer deletes their underlying absence record (see performMarkStatus_),
   *  this is what brings it back: for AM/PM, re-applies any absence record
   *  covering today whose reason doesn't already match what's showing. For
   *  Stay-in, simply clears its current entries and lets runAutoFillPass_'s
   *  usual Stay-in rules (multi-day continuation, next-day starts, same-day
   *  PM reference) recompute them fresh. */
  function pullBackAbsenceRecords_(sessForRefresh) {
    var pulled = 0;
    if (sessForRefresh === 'STAYIN') {
      APP.employees.forEach(function (emp) {
        if (!isTrue(emp.isStayIn)) return;
        var idx = APP.attendance.findIndex(function (r) { return r.empId === emp.id && r.session === 'STAYIN'; });
        if (idx >= 0) { APP.attendance.splice(idx, 1); pulled++; }
      });
    } else {
      Object.keys(REASON_CATEGORIES).forEach(function (catKey) {
        if (catKey === 'mc') return; // handled authoritatively by applyMcDirectly_ instead, including the RSO exception
        var listKey = REASON_CATEGORIES[catKey].listKey;
        (APP[listKey] || []).forEach(function (rec) {
          if (!coversDate_(rec, APP.date)) return;
          if (reasonSessionsFor_(rec.reasonName).indexOf(sessForRefresh) === -1) return;
          var bucket = bucketForReasonLocal(baseReasonNameOf_(rec.reason) || rec.reason);
          var current = attFor(rec.employeeId, sessForRefresh);
          if (current.reason === rec.reason && current.bucket === bucket) return;
          applyAttendanceLocal({ empId: rec.employeeId, session: sessForRefresh, status: bucket === 'In' ? 'In' : 'Out', reason: rec.reason, bucket: bucket });
          dirtyKeys.add(rec.employeeId + '|' + sessForRefresh);
          pulled++;
        });
      });
    }
    return pulled;
  }
  /** MC is the one reason that "always refreshes on all attendance types" —
   *  for every MC record covering today, force AM/PM/Stay-in to show it,
   *  overriding whatever's currently there, with exactly one exception: RSO
   *  is never overwritten by MC. Also handles the Sunday rule: if an MC
   *  covers a Monday, the preceding Sunday's Stay-in — if it was already
   *  saved to history — also gets marked with that same MC. */
  function applyMcDirectly_() {
    var filled = 0;
    var todayStr = APP.date;
    (APP.mcRecords || []).forEach(function (rec) {
      if (!coversDate_(rec, todayStr)) return;
      var emp = APP.employees.filter(function (e) { return e.id === rec.employeeId; })[0];
      if (!emp || !isActiveForParade_(emp)) return;
      var sessions = isTrue(emp.isStayIn) ? ['AM', 'PM', 'STAYIN'] : ['AM', 'PM'];
      sessions.forEach(function (sess) {
        var current = attFor(rec.employeeId, sess);
        if (baseReasonNameOf_(current.reason) === 'RSO') return;
        if (current.reason === rec.reason && current.bucket === 'MC') return;
        applyAttendanceLocal({ empId: rec.employeeId, session: sess, status: 'Out', reason: rec.reason, bucket: 'MC' });
        dirtyKeys.add(rec.employeeId + '|' + sess);
        filled++;
      });
    });
    return filled;
  }
  /** MC's Sunday-backward rule: if an MC covers a Monday (the only weekday
   *  whose preceding calendar day is a Sunday, since MC ranges are weekdays-
   *  only), the prior Sunday's Stay-in — if already saved to history by the
   *  time this Monday's MC is being processed — is updated to show the same
   *  MC. This reaches into a saved snapshot directly rather than live
   *  attendance, since by the time a later day's MC exists, the preceding
   *  Sunday's Stay-in has typically already been saved and moved past. */
  /** AM LL/AM OSL backward rule: whenever AM LL or AM OSL ends up applied to
   *  today's AM (whether picked live or carried forward from last night's
   *  Stay-in), the PRECEDING night's Stay-in — if already saved to history —
   *  is updated to show the same reason too. Same pattern as the MC Sunday-
   *  backward rule: reaches into an already-saved snapshot directly, since
   *  by the time today's AM is being processed, last night's Stay-in has
   *  typically already been saved and moved past. */
  async function applyAmLlOslBackward_() {
    var updated = 0;
    var yesterday = previousDayIso_(APP.date);
    var h = historyList.filter(function (x) { return x.date === yesterday && x.session === 'STAYIN'; })[0];
    if (!h || !h.snapshot || !h.snapshot.people) return 0;
    var amToday = APP.attendance.filter(function (r) { return r.session === 'AM' && (r.reason === 'AM LL' || r.reason === 'AM OSL'); });
    for (var i = 0; i < amToday.length; i++) {
      var rec = amToday[i];
      var person = h.snapshot.people.filter(function (p) { return p.id === rec.empId; })[0];
      if (!person || (person.reason === rec.reason && person.bucket === rec.bucket)) continue;
      person.reason = rec.reason; person.bucket = rec.bucket;
      updated++;
    }
    if (updated) {
      h.snapshot.present = h.snapshot.people.filter(function (p) { return p.bucket === 'In'; }).length;
      try { await idbBulkPut('paradeHistory', [h]); } catch (err) { console.log('[AutoFill] AM LL/OSL backward save FAILED:', err); }
    }
    return updated;
  }
  async function applyMcSundayBackward_() {
    var updated = 0;
    for (var mi = 0; mi < (APP.mcRecords || []).length; mi++) {
      var rec = APP.mcRecords[mi];
      var days = parseInt(rec.days, 10) || 1;
      var covered = weekdayDatesFrom_(rec.startDate, days);
      for (var di = 0; di < covered.length; di++) {
        var d = covered[di];
        var dObj = new Date(d + 'T00:00:00');
        if (dObj.getDay() !== 1) continue; // only Mondays have a Sunday immediately before them
        var sunday = new Date(dObj); sunday.setDate(sunday.getDate() - 1);
        var sundayIso = sunday.toISOString().slice(0, 10);
        var h = historyList.filter(function (x) { return x.date === sundayIso && x.session === 'STAYIN'; })[0];
        if (!h || !h.snapshot || !h.snapshot.people) continue;
        var person = h.snapshot.people.filter(function (p) { return p.id === rec.employeeId; })[0];
        if (!person || (person.reason === rec.reason && person.bucket === 'MC')) continue;
        var wasIn = person.bucket === 'In';
        person.reason = rec.reason; person.bucket = 'MC';
        h.snapshot.present = h.snapshot.people.filter(function (p) { return p.bucket === 'In'; }).length;
        try { await idbBulkPut('paradeHistory', [h]); updated++; } catch (err) { console.log('[AutoFill] MC Sunday-backward save FAILED:', err); }
      }
    }
    return updated;
  }
  /** [STAY-IN] Leave/Off "last day" rule: on the final day an MC/Leave/Off
   *  record covers, that same day's Stay-in shows a plain Out rather than
   *  the specific reason text (AM/PM still show the specific reason). Checks
   *  the absence record's own computed end date directly, not the already-
   *  applied reason text, since OFF records don't embed a date range in
   *  their text the way MC/OSL/LL do. */
  function clearEndingLeavesForStayIn_() {
    var cleared = 0;
    var todayStr = APP.date;
    APP.employees.forEach(function (emp) {
      if (!isActiveForParade_(emp) || !isTrue(emp.isStayIn)) return;
      ['leaves', 'offs'].forEach(function (catKey) {
        var listKey = REASON_CATEGORIES[catKey].listKey;
        (APP[listKey] || []).some(function (rec) {
          if (rec.employeeId !== emp.id) return false;
          var days = parseInt(rec.days, 10) || 1;
          var endDate = days <= 1 ? rec.startDate : weekdayDatesFrom_(rec.startDate, days).slice(-1)[0];
          if (endDate !== todayStr) return false;
          var current = attFor(emp.id, 'STAYIN');
          if (current.bucket === 'Out' && !current.reason) return true; // already a plain Out, nothing to do
          applyAttendanceLocal({ empId: emp.id, session: 'STAYIN', status: 'Out', reason: '', bucket: 'Out' });
          dirtyKeys.add(emp.id + '|STAYIN');
          cleared++;
          return true;
        });
      });
    });
    return cleared;
  }
  /** [PM] AM -> PM. Per the comprehensive spec: AM MA, AM LL, AM OSL, RSO,
   *  GD OUTGOING, ASA OUTGOING, LATE, SKILLSFUTURE, BR WORK, and OTHER all
   *  become a plain Out rather than carrying their specific text. Everything
   *  else (MEDIC DUTY, MED COVER, BR COHESION, COURSE, OOC) carries verbatim. */
  function carryForwardAmToPm_() {
    var filled = 0;
    var BLANK_ON_CARRY = ['AM MA', 'AM LL', 'AM OSL', 'RSO', 'GD OUTGOING', 'ASA OUTGOING', 'LATE', 'SKILLSFUTURE', 'BR WORK', 'OTHER'];
    APP.employees.forEach(function (emp) {
      if (!isActiveForParade_(emp)) return;
      var amRec = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'AM'; })[0];
      if (!amRec || amRec.bucket === 'In') return;
      var hasPM = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'PM'; }).length > 0;
      if (hasPM) return;
      if (BLANK_ON_CARRY.indexOf(amRec.reason) !== -1) {
        applyAttendanceLocal({ empId: emp.id, session: 'PM', status: 'Out', reason: '', bucket: 'Out' });
      } else {
        applyAttendanceLocal({ empId: emp.id, session: 'PM', status: 'Out', reason: amRec.reason, bucket: amRec.bucket });
      }
      dirtyKeys.add(emp.id + '|PM');
      filled++;
    });
    return filled;
  }
  /** [STAY-IN] Same-day PM -> Stay-in. GD CURRENT/ASA CURRENT, MEDIC DUTY,
   *  MED COVER, and COURSE all carry their specific text; any other out-type
   *  PM reason becomes a plain Out — this is the lowest-priority, catch-all
   *  rule, meant to run after the more specific Stay-in rules (multi-day
   *  continuation, next-day starts) have already had a chance to claim the
   *  slot. */
  function carryForwardPmToStayIn_() {
    var filled = 0;
    var SPECIFIC_CARRY = ['GD CURRENT', 'ASA CURRENT', 'MEDIC DUTY', 'MED COVER', 'COURSE'];
    APP.employees.forEach(function (emp) {
      if (!isActiveForParade_(emp) || !isTrue(emp.isStayIn)) return;
      var hasExisting = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'STAYIN'; }).length > 0;
      if (hasExisting) return;
      var pmRec = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'PM'; })[0];
      if (!pmRec || pmRec.bucket === 'In') return;
      if (SPECIFIC_CARRY.indexOf(pmRec.reason) !== -1) {
        applyAttendanceLocal({ empId: emp.id, session: 'STAYIN', status: 'Out', reason: pmRec.reason, bucket: pmRec.bucket });
      } else {
        applyAttendanceLocal({ empId: emp.id, session: 'STAYIN', status: 'Out', reason: '', bucket: 'Out' });
      }
      dirtyKeys.add(emp.id + '|STAYIN');
      filled++;
    });
    return filled;
  }
  /** [AM] Yesterday's Stay-in -> today's AM. Per the comprehensive spec:
   *  - GD CURRENT/ASA CURRENT transform into GD OUTGOING/ASA OUTGOING
   *  - AM LL, AM OSL, BR COHESION, COURSE carry over verbatim
   *  - MEDIC DUTY/MED COVER carry over verbatim, but ONLY when that Stay-in
   *    night was a Sunday
   *  - RSO, LATE, SKILLSFUTURE, BR WORK, OTHER all become a plain Out
   *  Anything not listed here (e.g. a plain Out, or reasons that shouldn't
   *  realistically reach Stay-in) doesn't carry at all. */
  function carryForwardStayInAbsencesToNextAm_() {
    var filled = 0;
    var TRANSFORM = { 'GD CURRENT': 'GD OUTGOING', 'ASA CURRENT': 'ASA OUTGOING' };
    var VERBATIM = ['AM LL', 'AM OSL', 'AM MA', 'BR COHESION', 'COURSE'];
    var VERBATIM_SUNDAY_ONLY = ['MEDIC DUTY', 'MED COVER'];
    var BLANK_ON_CARRY = ['RSO', 'LATE', 'SKILLSFUTURE', 'BR WORK', 'OTHER'];
    var yesterday = previousDayIso_(APP.date);
    var wasSunday = new Date(yesterday + 'T00:00:00').getDay() === 0;
    var stayInRecord = historyList.filter(function (h) { return h.date === yesterday && h.session === 'STAYIN'; })[0];
    if (!stayInRecord) return 0;
    var people = (stayInRecord.snapshot && stayInRecord.snapshot.people) || [];
    people.forEach(function (p) {
      if (p.bucket === 'In') return;
      var emp = APP.employees.filter(function (e) { return e.id === p.id; })[0];
      if (!emp || !isActiveForParade_(emp)) return;
      var hasExisting = APP.attendance.filter(function (r) { return r.empId === p.id && r.session === 'AM'; }).length > 0;
      if (hasExisting) return;
      var newReason = null, newBucket = null;
      if (TRANSFORM.hasOwnProperty(p.reason)) { newReason = TRANSFORM[p.reason]; newBucket = bucketForReasonLocal(newReason); }
      else if (VERBATIM.indexOf(p.reason) !== -1) { newReason = p.reason; newBucket = p.bucket; }
      else if (wasSunday && VERBATIM_SUNDAY_ONLY.indexOf(p.reason) !== -1) { newReason = p.reason; newBucket = p.bucket; }
      else if (BLANK_ON_CARRY.indexOf(p.reason) !== -1) { newReason = ''; newBucket = 'Out'; }
      else return;
      applyAttendanceLocal({ empId: p.id, session: 'AM', status: newBucket === 'In' ? 'In' : 'Out', reason: newReason, bucket: newBucket });
      dirtyKeys.add(p.id + '|AM');
      filled++;
    });
    return filled;
  }
  /** [STAY-IN] MC/OFF/Leave absence records covering TOMORROW also mark
   *  tonight's Stay-in absent — someone who knows they're off/on leave/on MC
   *  starting tomorrow has typically already left camp tonight. */
  function applyNextDayAbsencesToStayIn_() {
    var filled = 0;
    var tomorrow = nextDayIso_(APP.date);
    var relevantCats = ['leaves', 'offs'];
    APP.employees.forEach(function (emp) {
      if (!isActiveForParade_(emp) || !isTrue(emp.isStayIn)) return;
      var hasExisting = APP.attendance.filter(function (r) { return r.empId === emp.id && r.session === 'STAYIN'; }).length > 0;
      if (hasExisting) return;
      for (var ci = 0; ci < relevantCats.length; ci++) {
        var listKey = REASON_CATEGORIES[relevantCats[ci]].listKey;
        var match = (APP[listKey] || []).filter(function (r) { return r.employeeId === emp.id && coversDate_(r, tomorrow); })[0];
        if (match) {
          var bucket = bucketForReasonLocal(baseReasonNameOf_(match.reason) || match.reason);
          applyAttendanceLocal({ empId: emp.id, session: 'STAYIN', status: 'Out', reason: match.reason, bucket: bucket });
          dirtyKeys.add(emp.id + '|STAYIN');
          filled++;
          break;
        }
      }
    });
    return filled;
  }
  /** Direction A: saved absence records -> today's live view. For every record
   *  (across all 5 categories) whose range covers today, apply it to anyone who
   *  doesn't already have an explicit attendance entry for that session today. */
  function applyLocalAbsenceRecordsToToday_() {
    Object.keys(REASON_CATEGORIES).forEach(function (catKey) {
      var listKey = REASON_CATEGORIES[catKey].listKey;
      (APP[listKey] || []).forEach(function (rec) {
        if (!coversDate_(rec, APP.date)) return;
        var bucket = bucketForReasonLocal(baseReasonNameOf_(rec.reason) || rec.reason);
        reasonSessionsFor_(rec.reasonName).forEach(function (sess) {
          var hasExisting = APP.attendance.filter(function (r) { return r.empId === rec.employeeId && r.session === sess; }).length > 0;
          if (hasExisting) return;
          applyAttendanceLocal({ empId: rec.employeeId, session: sess, status: bucket === 'In' ? 'In' : 'Out', reason: rec.reason, bucket: bucket });
        });
      });
    });
  }

  /** Direction B: live picker -> saved absence record. Called after every
   *  attendance-changing action in the live picker. First removes whichever
   *  existing record (in any category) currently covers today for this
   *  employee, then, if the newly-applied reason belongs to one of the 5
   *  categories, writes a fresh record for it. All in-memory (APP) updates
   *  happen synchronously before any IndexedDB write, so a caller's render()
   *  right after calling this always sees the final, consistent state —
   *  the actual persistence to IndexedDB then happens in the background. */
  function syncAbsenceRecordForLocal_(empId, reasonName, reasonString, startDate, days) {
    var todayStr = APP.date;
    var toDelete = [];
    Object.keys(REASON_CATEGORIES).forEach(function (catKey) {
      var listKey = REASON_CATEGORIES[catKey].listKey;
      var keep = [];
      (APP[listKey] || []).forEach(function (r) {
        if (r.employeeId === empId && coversDate_(r, todayStr)) toDelete.push(r.id); else keep.push(r);
      });
      APP[listKey] = keep;
    });

    var newRec = null;
    var catKey = REASON_CATEGORY_OF_NAME[reasonName];
    if (catKey && reasonName) {
      var listKey = REASON_CATEGORIES[catKey].listKey;
      newRec = { id: uid_(), employeeId: empId, reasonName: reasonName, reason: reasonString, startDate: startDate, days: days, createdAt: new Date().toISOString() };
      APP[listKey].push(newRec);
    }

    if (catKey === 'mc') { applyMcDirectly_(); applyMcSundayBackward_(); }
    if (catKey === 'leaves' || catKey === 'offs' || catKey === 'ma') applyNextDayAbsencesToStayIn_();

    (async function persist() {
      for (var i = 0; i < toDelete.length; i++) await idbDelete('absenceRecords', toDelete[i]);
      if (newRec) await idbBulkPut('absenceRecords', [newRec]);
    })();
  }

  function runAutoFillPass_() {
    var n1 = applyMcDirectly_();
    var n2 = clearEndingLeavesForStayIn_();
    var n3 = carryForwardStayInAbsencesToNextAm_();
    var n4 = carryForwardAmToPm_();
    var n5 = applyNextDayAbsencesToStayIn_();
    var n6 = carryForwardPmToStayIn_();
    applyLocalAbsenceRecordsToToday_();
    applyMcSundayBackward_(); // background — writes to a different date's already-saved history, not today's view
    applyAmLlOslBackward_(); // background — same pattern, for the preceding Stay-in night
    var total = n1 + n2 + n3 + n4 + n5 + n6;
    if (total) showToast('Auto-marked ' + total + ' record(s) — review before saving.');
  }

  function buildExportText_(opts) {
    var timeLabel = opts.timeLabel || (opts.session === 'AM' ? '0745HRS' : '1715HRS');
    var total = opts.people.length;
    var present = opts.people.filter(function (p) { return p.bucket === 'In'; }).length;

    var lines = [];
    lines.push((APP.companyName || '') + ' (Strength as of ' + opts.label + ', ' + formatDDMMYY_(opts.dateIso) + ', ' + timeLabel + ')');
    lines.push('');
    lines.push('CDO -' + (opts.cdo ? ' ' + opts.cdo.toUpperCase() : ''));
    lines.push('CDS -' + (opts.cds ? ' ' + opts.cds.toUpperCase() : ''));
    lines.push('');
    lines.push('Total - ' + total);
    lines.push('Present - ' + present);

    var groups = {}, order = [];
    opts.people.forEach(function (p) {
      var g = p.subUnit || '—';
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(p);
    });
    order = sortGroupNamesBySubUnitOrder_(order);

    order.forEach(function (g) {
      var members = groups[g];
      if (!members.length) return;
      var presentCount = members.filter(function (p) { return p.bucket === 'In'; }).length;
      lines.push('');
      lines.push(g + ' - ' + presentCount + '/' + members.length);
      members.forEach(function (p) {
        if (p.bucket === 'In') {
          lines.push(p.rank + ' ' + p.name + ' \u2705');
        } else {
          var reasonText = formatReasonForExport_(p.reason) || BUCKET_LABEL[p.bucket] || p.bucket;
          lines.push(p.rank + ' ' + p.name + ' \u274c (' + reasonText + ')');
        }
      });
    });

    return lines.join('\n');
  }

  function submitAbsenceForm_(catKey) {

    else if (fields.needsDays) result = buildDatesReasonString_(absenceForm.reasonName, absenceForm.days, absenceForm.date);

    else result = { ok: true, value: absenceForm.reasonName };

  function parseTextReasonString_(reasonName, reasonStr) {
    if (!reasonStr) return null;

  function parseTextDatesReasonString_(reasonName, reasonStr) {
    if (!reasonStr) return null;
    var escaped = reasonName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var multi = reasonStr.match(new RegExp('^(\\d+)D ' + escaped + ' (.+) (\\d{6})-(\\d{6})$'));
    if (multi) return { days: parseInt(multi[1], 10), text: multi[2], startDate: ddmmyyToIso_(multi[3]), endDate: ddmmyyToIso_(multi[4]) };
    var single = reasonStr.match(new RegExp('^' + escaped + ' (.+) (\\d{6})$'));
    if (single) return { days: 1, text: single[1], startDate: ddmmyyToIso_(single[2]), endDate: '' };
    return null;
  }
  function startEditAbsence_(catKey, id) {

    absenceForm = { employeeId: rec.employeeId, reasonName: rec.reasonName, days: days, date: rec.startDate, endDate: endDate, text: text };

  /** The order field is the single source of truth for sub-unit display
   *  order everywhere — Parade State grouping, filter chips, roster sorting,
   *  and every export. Sorting APP.subUnits by it here means every consumer
   *  that just iterates APP.subUnits in array order automatically respects
   *  whatever arrangement was set in the Data tab. */
  function sortSubUnitsByOrder_() {
    APP.subUnits.sort(function (a, b) { return (typeof a.order === 'number' ? a.order : 0) - (typeof b.order === 'number' ? b.order : 0); });
  }
  function nextSubUnitOrder_() {
    var max = -1;
    APP.subUnits.forEach(function (s) { if (typeof s.order === 'number' && s.order > max) max = s.order; });
    return max + 1;
  }
  /** Legacy sub-units (created before this feature existed) won't have an
   *  order field — this assigns one based on their current position so
   *  future sorts are stable, without disturbing whatever order they were
   *  already effectively in. */
  async function backfillSubUnitOrder_() {
    var changed = [];
    APP.subUnits.forEach(function (s, i) {
      if (typeof s.order !== 'number') { s.order = i; changed.push(s); }
    });
    if (changed.length) { try { await idbBulkPut('subUnits', changed); } catch (err) { console.log('[Data] Sub-unit order backfill failed:', err); } }
  }
  /** Sorts a list of group names (e.g. sub-unit names pulled from a saved
   *  snapshot's people) by the current sub-unit order — any name that
   *  doesn't match a currently-known sub-unit (e.g. one that's since been
   *  renamed or deleted) keeps its original relative position, appended
   *  after everything that does match. */
  function sortGroupNamesBySubUnitOrder_(names) {
    var orderOf = {};
    APP.subUnits.forEach(function (s, i) { orderOf[s.name] = i; });
    var known = names.filter(function (n) { return orderOf.hasOwnProperty(n); });
    var unknown = names.filter(function (n) { return !orderOf.hasOwnProperty(n); });
    known.sort(function (a, b) { return orderOf[a] - orderOf[b]; });
    return known.concat(unknown);
  }
  /** Same idea as sortGroupNamesBySubUnitOrder_, but for a list of people
   *  (employees/superiors) directly — used for the Data tab's roster lists.
   *  Anyone whose sub-unit doesn't match a currently-known one (including no
   *  sub-unit at all) sorts to the bottom. */
  function sortPeopleBySubUnitOrder_(people) {
    var orderOf = {};
    APP.subUnits.forEach(function (s, i) { orderOf[s.name] = i; });
    return people.slice().sort(function (a, b) {
      var oa = orderOf.hasOwnProperty(a.subUnit) ? orderOf[a.subUnit] : Infinity;
      var ob = orderOf.hasOwnProperty(b.subUnit) ? orderOf[b.subUnit] : Infinity;
      return oa - ob;
    });
  }
  async function moveSubUnit_(id, direction) {
    var idx = APP.subUnits.findIndex(function (s) { return s.id === id; });
    var swapWith = idx + direction;
    if (idx === -1 || swapWith < 0 || swapWith >= APP.subUnits.length) return;
    var a = APP.subUnits[idx], b = APP.subUnits[swapWith];
    var tmp = a.order; a.order = b.order; b.order = tmp;
    sortSubUnitsByOrder_();
    try {
      await idbBulkPut('subUnits', [a, b]);
      render();
    } catch (err) {
      console.log('[Data] Move sub-unit FAILED:', err);
      showToast('Reorder failed — ' + (err && err.message ? err.message : 'see Logcat/Console.'));
    }
  }

  // ---------- master.json export / import ----------
  // Covers roster + configuration data — sub-units, employees, superiors, the
  // 5 absence-record categories, company name, and time presets — so someone
  // else can bootstrap their own install with the same setup instead of
  // re-entering everyone by hand. Deliberately does NOT include day-to-day
  // attendance, daily CDS/CDO/time picks, or saved parade history — those are
  // this device's own operational log, not shared setup data.
  function buildMasterExportJson_() {
    var payload = {
      exportedAt: new Date().toISOString(),
      appVersion: '1.0.5',
      subUnits: APP.subUnits,
      employees: APP.employees,
      superiors: APP.superiors,
      mcRecords: APP.mcRecords,
      leaveRecords: APP.leaveRecords,
      maRecords: APP.maRecords,
      offRecords: APP.offRecords,
      otherRecords: APP.otherRecords,
      companyName: APP.companyName,
      timePresets: APP.timePresets
    };
    return JSON.stringify(payload, null, 2);
  }
  /** Exports whatever's currently visible under History's date/AM/PM/Stay-in
   *  filters — each record's people list sorted by the current sub-unit
   *  order (see sortPeopleBySubUnitOrder_), not insertion order. */
  function buildHistoryExportJson_() {
    var results = getFilteredHistory();
    var records = results.map(function (h) {
      var snap = h.snapshot || {};
      return {
        date: h.date, session: h.session, label: snap.label, timeLabel: snap.timeLabel,
        cds: snap.cds, cdo: snap.cdo, total: snap.total, present: snap.present,
        people: sortPeopleBySubUnitOrder_(snap.people || [])
      };
    });
    return JSON.stringify({ exportedAt: new Date().toISOString(), appVersion: '1.0.6', recordCount: records.length, records: records }, null, 2);
  }

  async function applyMasterImport_(text) {
    var data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      showToast('That doesn\'t look like valid JSON.');
      return;
    }
    if (!data || typeof data !== 'object') { showToast('Invalid master.json — no data found.'); return; }

    var subUnits = Array.isArray(data.subUnits) ? data.subUnits : [];
    var employees = Array.isArray(data.employees) ? data.employees : [];
    var superiors = Array.isArray(data.superiors) ? data.superiors : [];
    var mcRecords = Array.isArray(data.mcRecords) ? data.mcRecords : [];
    var leaveRecords = Array.isArray(data.leaveRecords) ? data.leaveRecords : [];
    var maRecords = Array.isArray(data.maRecords) ? data.maRecords : [];
    var offRecords = Array.isArray(data.offRecords) ? data.offRecords : [];
    var otherRecords = Array.isArray(data.otherRecords) ? data.otherRecords : [];
    var companyName = typeof data.companyName === 'string' ? data.companyName : '';
    var timePresets = Array.isArray(data.timePresets) ? data.timePresets : [];
    var allAbsenceRecords = mcRecords.concat(leaveRecords, maRecords, offRecords, otherRecords);

    try {
      await idbClear('subUnits'); await idbBulkPut('subUnits', subUnits);
      await idbClear('employees'); await idbBulkPut('employees', employees);
      await idbClear('superiors'); await idbBulkPut('superiors', superiors);
      await idbClear('absenceRecords'); await idbBulkPut('absenceRecords', allAbsenceRecords);
      await idbClear('timePresets'); await idbBulkPut('timePresets', timePresets);
      await idbBulkPut('settings', [{ key: 'companyName', value: companyName }]);

      APP.subUnits = subUnits;
      sortSubUnitsByOrder_();
      APP.employees = employees;
      APP.superiors = superiors;
      APP.mcRecords = mcRecords;
      APP.leaveRecords = leaveRecords;
      APP.maRecords = maRecords;
      APP.offRecords = offRecords;
      APP.otherRecords = otherRecords;
      APP.companyName = companyName;
      APP.timePresets = timePresets;

      console.log('[Data] master.json import applied:', subUnits.length, 'sub-units,', employees.length, 'employees,', superiors.length, 'superiors,', allAbsenceRecords.length, 'absence records.');
      showToast('Import complete — ' + employees.length + ' employees, ' + subUnits.length + ' sub-units loaded.');
      closeDataModal();
    } catch (err) {
      console.log('[Data] master.json import FAILED:', err);
      showToast('Import failed — ' + (err && err.message ? err.message : 'see Logcat/Console.'));
    }
  }

  function bindBulkModalEvents() {
    document.getElementById('modalOverlay').addEventListener('click', function (ev) { if (ev.target.id === 'modalOverlay') closeDataModal(); });
    document.getElementById('modalClose').addEventListener('click', closeDataModal);

    var parseBtn = document.getElementById('bulkParseBtn');
    if (parseBtn) parseBtn.addEventListener('click', function () {
      var text = document.getElementById('bulkTextarea').value;
      var names = text.split(/\r?\n|,/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
      var defaultRank = (bulkKind === 'employee' ? EMPLOYEE_RANKS : SUPERIOR_RANKS)[0];
      var defaultSubUnit = APP.subUnits.length ? APP.subUnits[0].name : '';
      bulkNames = names.map(function (n) { return { name: n, rank: defaultRank, subUnit: defaultSubUnit }; });
      renderBulkModal();
    });

    document.querySelectorAll('[data-bulk-rank]').forEach(function (sel) {
      sel.addEventListener('change', function () { bulkNames[+sel.getAttribute('data-bulk-rank')].rank = sel.value; });
    });
    document.querySelectorAll('[data-bulk-subunit]').forEach(function (sel) {
      sel.addEventListener('change', function () { bulkNames[+sel.getAttribute('data-bulk-subunit')].subUnit = sel.value; });
    });
    document.querySelectorAll('[data-bulk-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () { bulkNames.splice(+btn.getAttribute('data-bulk-remove'), 1); renderBulkModal(); });
    });

    var addAllBtn = document.getElementById('bulkAddAllBtn');
    if (addAllBtn) addAllBtn.addEventListener('click', async function () {
      var payload = bulkNames.map(function (p) { return { rank: p.rank, name: p.name, subUnit: p.subUnit }; });
      var kind = bulkKind, listKey = kind === 'employee' ? 'employees' : 'superiors', storeName = listKey;
      closeDataModal();
      var newRecs = payload.map(function (p) {
        var obj = { id: uid_(), rank: p.rank, name: p.name, subUnit: p.subUnit };
        if (kind === 'employee') { obj.isCDS = false; obj.isExcluded = false; obj.isORD = false; obj.isStayIn = false; }
        else { obj.isCDO = false; }
        return obj;
      });
      APP[listKey] = APP[listKey].concat(newRecs);
      await idbBulkPut(storeName, newRecs);
      render();
      showToast('Added ' + newRecs.length + (kind === 'employee' ? ' employees.' : ' superiors.'));
    });
  }

  document.addEventListener('DOMContentLoaded', function () {

    boot();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    }

    // ============ CAPACITOR OTA UPDATE CHECK ============
    // Only runs inside the native app built via Capacitor (see MOBILE_APP_GUIDE.md) —
    // window.Capacitor doesn't exist in a plain browser/PWA context, so this entire
    // block is a no-op there and never touches the GitHub Pages deployment.
    //
    // Checks a small update-manifest.json (hosted alongside this same page) for a
    // newer version than what's currently installed, downloads it quietly while the
    // app is in the foreground, and applies it the moment the app is backgrounded —
    // so it's never interrupting an active session, and the next time the app is
    // opened it's already the new version. Every step below shows a toast and logs
    // to console — nothing fails silently, so if it's not working, what you see
    // on screen (or in Logcat/Console via Android Studio/Xcode) says exactly why.
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater) {
      (function () {
        var Updater = window.Capacitor.Plugins.CapacitorUpdater;
        var AppPlugin = window.Capacitor.Plugins.App;
        var Preferences = window.Capacitor.Plugins.Preferences;
        // IMPORTANT: this must be an absolute URL, not a relative one. The app's web
        // content is bundled locally inside the APK/IPA, so a relative path like
        // './update-manifest.json' would resolve against that local bundle and just
        // re-read the stale, build-time copy forever — never seeing real updates.
        // Point this at wherever you actually host update-manifest.json (e.g. your
        // GitHub Pages repo root), and update it if that URL ever changes.
        var UPDATE_MANIFEST_URL = 'https://fro5tydog.github.io/Parade_State_App/update-manifest.json';
        var VERSION_KEY = 'ota_current_version';
        var pendingUpdate = null;

        console.log('[OTA] Updater plugin detected — initializing.');
        (Preferences ? Preferences.get({ key: VERSION_KEY }) : Promise.resolve(null)).then(function (res) {
          var current = (res && res.value) || '(none yet — first launch)';
          console.log('[OTA] Current applied version at this boot:', current);
          showToast('App version: ' + current);
        });

        Updater.notifyAppReady()
          .then(function () { console.log('[OTA] notifyAppReady OK.'); })
          .catch(function (err) { console.log('[OTA] notifyAppReady FAILED:', err); });

        function checkForUpdate() {
          console.log('[OTA] Checking', UPDATE_MANIFEST_URL);
          fetch(UPDATE_MANIFEST_URL, { cache: 'no-store' })
            .then(function (r) {
              console.log('[OTA] Manifest fetch HTTP status:', r.status);
              if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching manifest');
              return r.json();
            })
            .then(function (manifest) {
              console.log('[OTA] Manifest:', JSON.stringify(manifest));
              return (Preferences ? Preferences.get({ key: VERSION_KEY }) : Promise.resolve(null)).then(function (res) {
                var current = (res && res.value) || '0.0.0';
                console.log('[OTA] Installed version:', current, '| Manifest version:', manifest.version);
                if (manifest.version && manifest.version !== current) {
                  showToast('Downloading latest version (v' + manifest.version + ')...');
                  return Updater.download({ version: manifest.version, url: manifest.url })
                    .then(function (data) {
                      console.log('[OTA] Download OK:', JSON.stringify(data));
                      pendingUpdate = { data: data, version: manifest.version };
                      showToast('Latest version downloaded (v' + manifest.version + ') — will finish applying once you leave the app.');
                    })
                    .catch(function (err) {
                      console.log('[OTA] Download FAILED:', err);
                      showToast('Update download failed — see Logcat/Console.');
                    });
                } else {
                  console.log('[OTA] Already on latest version — nothing to do.');
                  showToast('App fully up to date (v' + current + ').');
                }
              });
            })
            .catch(function (err) {
              console.log('[OTA] Update check FAILED:', err);
              showToast('Update check failed: ' + (err && err.message ? err.message : err));
            });
        }

        if (AppPlugin) {
          AppPlugin.addListener('appStateChange', function (state) {
            console.log('[OTA] appStateChange — isActive:', state.isActive);
            if (state.isActive) {
              checkForUpdate();
            } else if (pendingUpdate) {
              var toApply = pendingUpdate;
              pendingUpdate = null;
              console.log('[OTA] Backgrounded with a pending update — applying', toApply.version);
              Updater.set(toApply.data)
                .then(function () {
                  console.log('[OTA] Applied. Now on version', toApply.version);
                  return Preferences && Preferences.set({ key: VERSION_KEY, value: toApply.version });
                })
                .catch(function (err) { console.log('[OTA] Apply FAILED:', err); });
            }
          });
        }

        checkForUpdate(); // also check once right at cold start
      })();
    } else {
      // This branch firing means the updater never even starts — almost always
      // a plugin-registration issue, not a network/manifest issue. Check exactly
      // which piece is missing:
      var hasCapacitor = !!window.Capacitor;
      var hasPlugins = hasCapacitor && !!window.Capacitor.Plugins;
      var hasUpdater = hasPlugins && !!window.Capacitor.Plugins.CapacitorUpdater;
      console.log('[OTA] Updater NOT available — window.Capacitor:', hasCapacitor, '| .Plugins:', hasPlugins, '| .Plugins.CapacitorUpdater:', hasUpdater);
      if (hasCapacitor) {
        // Only show this one visibly — if window.Capacitor itself is missing this
        // isn't even running inside Capacitor at all (e.g. a plain browser), which
        // isn't worth alarming over.
        showToast('OTA updater plugin not found — check Logcat/Console for [OTA] logs.');
      }
    }
  });
</script>
</body>
</html>
