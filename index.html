          '<button class="btn small danger" data-del-timepreset="' + esc(t.id) + '">DELETE</button></div>';
      }).join('') || '<div class="empty-hint">No time presets yet.</div>';
    } else if (REASON_CATEGORIES[dataSubTab]) {
      html += absenceRecordsPanel(dataSubTab);
    }
    return html;
  }

  // ---------- Absence records (MC / Leaves / MA / Offs / Others) ----------
  /** Fills the form's From/To from the usual rules for the chosen reason,
   *  first day and number of days (see defaultSpan_). */
  function applyFormCoverDefaults_() {
    if (!absenceForm.date || !absenceForm.reasonName) return;
    var f = adminFieldsFor_(absenceForm.reasonName);
    var sp = defaultSpan_(absenceForm.reasonName, absenceForm.date, absenceForm.fromSession || 'AM', { startDate: absenceForm.date, days: f.needsDays ? absenceForm.days : 1 });
    absenceForm.fromDate = sp.startDate; absenceForm.fromSession = sp.startSession;
    absenceForm.toDate = sp.endDate; absenceForm.toSession = sp.endSession;
  }
  function updateCoverInputs_() {
    var map = { absFromDate: 'fromDate', absFromSess: 'fromSession', absToDate: 'toDate', absToSess: 'toSession' };
    Object.keys(map).forEach(function (id) { var el = document.getElementById(id); if (el) el.value = absenceForm[map[id]]; });
  }
  function absenceRecordsPanel(catKey) {
    var categoryReasons = Object.keys(REASON_CATEGORY_OF_NAME).filter(function (r) { return REASON_CATEGORY_OF_NAME[r] === catKey; });

    if (!absenceForm.reasonName || categoryReasons.indexOf(absenceForm.reasonName) === -1) {
      absenceForm.reasonName = categoryReasons.length ? categoryReasons[0] : '';
      applyFormCoverDefaults_();
    }

    var isEditing = editingAbsence.catKey === catKey && !!editingAbsence.id;
    var fields = adminFieldsFor_(absenceForm.reasonName);
    var sessOpts = function (sel) {
      return SESSION_ORDER.map(function (sv) { return '<option value="' + sv + '" ' + (sel === sv ? 'selected' : '') + '>' + SESSION_SHORT[sv] + '</option>'; }).join('');
    };

    var html = '<div class="field-row"><label>Employee</label><select id="absEmployee">' +
      '<option value="">— select employee —</option>' +
      APP.employees.map(function (e) { return '<option value="' + esc(e.id) + '" ' + (absenceForm.employeeId === e.id ? 'selected' : '') + '>' + esc(e.rank) + ' ' + esc(e.name) + '</option>'; }).join('') +
      '</select></div>';

    html += '<div class="field-row"><label>Reason</label><select id="absReason">' +
      categoryReasons.map(function (r) { return '<option value="' + esc(r) + '" ' + (absenceForm.reasonName === r ? 'selected' : '') + '>' + esc(r) + '</option>'; }).join('') +
      '</select></div>';

    if (fields.needsText) {
      html += '<div class="field-row"><label>' + esc(fields.textPlaceholder) + '</label><input id="absText" placeholder="' + esc(fields.textPlaceholder) + '" value="' + esc(absenceForm.text) + '"></div>';
    }
    if (fields.needsDays) {
      if (absenceForm.date && !absenceForm.lastDate) absenceForm.lastDate = addWeekdaysIso_(absenceForm.date, absenceForm.days);
      html += '<div class="field-row-2">' +
        '<div class="field-row"><label>Days</label><input type="number" min="1" id="absDays" value="' + esc(absenceForm.days) + '"></div>' +
        '<div class="field-row"><label>First day</label><input type="date" id="absDate" value="' + esc(absenceForm.date) + '"></div></div>' +
        '<div class="field-row"><label>Last day</label><input type="date" id="absLastDate" value="' + esc(absenceForm.lastDate) + '"></div>';
    } else {

  // ---------- master.json export / import ----------
  // Covers roster + configuration data — sub-units, employees, superiors, the
  // 5 absence-record categories, company name, and time presets — so someone
  // else can bootstrap their own install with the same setup instead of
  // re-entering everyone by hand. Deliberately does NOT include day-to-day
  // attendance, daily CDS/CDO/time picks, or saved parade history — those are
  // this device's own operational log, not shared setup data.
  /** Tries the native share sheet first — a genuine web standard, not a
   *  Capacitor plugin, so it needs no rebuild and may or may not be exposed
   *  depending on this WebView's exact setup. Falls back to the classic
   *  blob+download-link trick, which is known to be unreliable inside a
   *  native WebView with no way for JS to confirm whether it actually
   *  worked — so that fallback's toast stays honest about the uncertainty
   *  rather than confidently claiming a save that may not have happened. */
  async function shareOrDownloadJson_(filename, text) {
    try {
      if (navigator.share && navigator.canShare) {
        var file = new File([text], filename, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          return;
        }
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return; // user cancelled the share sheet — not a failure
      console.log('[Export] navigator.share failed, falling back:', err);
    }
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Tried to save ' + filename + ' — if nothing happened, use COPY instead.');
    } catch (err) {
      console.log('[Export] ' + filename + ' download failed:', err);
      showToast('Download not available here — use COPY instead.');
    }
  }
  // ================= BACKUP (one file: Data + History) =================
  /* One JSON file holds everything: sub-units, employees, superiors, every
   * reason record (incl. Mark In/Out), company name, time presets, the
   * saved attendance/CDS/CDO per day, and every saved parade in History.
   * Import reads the file first and shows what's inside before anything
   * changes. Restoring Data replaces it; History is only ever added to —
   * parades already saved on this phone are never overwritten. Older
   * master.json and history files are still accepted. */
  var backupImport = null; // parsed file waiting for the person to choose what to do

  function backupFilename_() { return 'parade-state-backup-' + todayIso_() + '.json'; }
  async function buildBackupJson_() {
    var attendance = await idbGetAll('attendance');
    var dailyDuty = await idbGetAll('dailyDuty');
    return JSON.stringify({
      app: 'parade-state', kind: 'backup', backupVersion: 1, appVersion: '2.0.0', exportedAt: new Date().toISOString(),
      data: {
        subUnits: APP.subUnits, employees: APP.employees, superiors: APP.superiors,
        absenceRecords: allSpans_().concat(APP.marks || []),
        companyName: APP.companyName, timePresets: APP.timePresets,
        spanModelSince: spanModelSince, attendance: attendance, dailyDuty: dailyDuty
      },
      history: historyList
    }, null, 2);
  }
  /** Old-style history rows (people at the top level) → stored row shape. */
  function normalizeHistoryRow_(r) {
    if (!r || !r.date || !r.session) return null;
    if (r.snapshot && Array.isArray(r.snapshot.people)) return { key: r.date + '|' + r.session, date: r.date, session: r.session, snapshot: r.snapshot, savedAt: r.savedAt || new Date().toISOString() };
    if (!Array.isArray(r.people)) return null;
    return { key: r.date + '|' + r.session, date: r.date, session: r.session,
      snapshot: { date: r.date, session: r.session, label: r.label, timeLabel: r.timeLabel, cds: r.cds, cdo: r.cdo, total: r.total, present: r.present, people: r.people },
      savedAt: new Date().toISOString() };
  }
  function parseBackup_(text) {
    var d;
    try { d = JSON.parse(text); } catch (err) { return { error: 'That file isn\'t readable as a backup (not valid JSON).' }; }
    if (!d || typeof d !== 'object') return { error: 'No data found in that file.' };
    var out = { source: '', exportedAt: d.exportedAt || '', data: null, history: [] };
    var arr = function (x) { return Array.isArray(x) ? x : []; };
    if (d.kind === 'backup' && d.data) {
      out.source = 'Full backup';
      out.data = d.data;
      out.history = arr(d.history);
    } else if (Array.isArray(d.employees) || Array.isArray(d.subUnits)) {
      out.source = 'Older master.json (Data only, no History)';
      out.data = { subUnits: arr(d.subUnits), employees: arr(d.employees), superiors: arr(d.superiors),
        absenceRecords: arr(d.mcRecords).concat(arr(d.leaveRecords), arr(d.maRecords), arr(d.offRecords), arr(d.otherRecords), arr(d.marks)),
        companyName: typeof d.companyName === 'string' ? d.companyName : '', timePresets: arr(d.timePresets) };
    } else if (Array.isArray(d.records)) {
      out.source = 'Older History file (History only, no Data)';
      out.history = d.records;
    } else {
      return { error: 'This doesn\'t look like a Parade State backup.' };
    }
    out.history = out.history.map(normalizeHistoryRow_).filter(Boolean);
    var have = {};
    historyList.forEach(function (h) { have[h.key] = true; });
    out.newHistory = out.history.filter(function (h) { return !have[h.key]; }).length;
    return out;
  }
  async function applyBackupData_(data) {
    var arr = function (x) { return Array.isArray(x) ? x : []; };
    await idbClear('subUnits'); await idbBulkPut('subUnits', arr(data.subUnits));
    await idbClear('employees'); await idbBulkPut('employees', arr(data.employees));
    await idbClear('superiors'); await idbBulkPut('superiors', arr(data.superiors));
    await idbClear('absenceRecords'); await idbBulkPut('absenceRecords', arr(data.absenceRecords));
    await idbClear('timePresets'); await idbBulkPut('timePresets', arr(data.timePresets));
    if (Array.isArray(data.attendance)) { await idbClear('attendance'); await idbBulkPut('attendance', data.attendance); }
    if (Array.isArray(data.dailyDuty)) { await idbClear('dailyDuty'); await idbBulkPut('dailyDuty', data.dailyDuty); }
    var settings = [{ key: 'companyName', value: typeof data.companyName === 'string' ? data.companyName : '' }];
    if (data.spanModelSince) settings.push({ key: 'spanModelSince', value: data.spanModelSince });
    await idbBulkPut('settings', settings);

    APP.subUnits = await idbGetAll('subUnits');
    sortSubUnitsByOrder_();
    await backfillSubUnitOrder_();
    setEmployees_(await idbGetAll('employees'));
    await backfillEmployeeOrder_();
    APP.superiors = await idbGetAll('superiors');
    APP.timePresets = await idbGetAll('timePresets');
    APP.companyName = settings[0].value;
    await loadAbsenceRecords_(); // also converts records from older exports to start/end records
    await loadAttendanceAndDutyForDate_(APP.date);
    recomputeAttendance_();
  }
  async function mergeBackupHistory_(rows) {
    var have = {};
    historyList.forEach(function (h) { have[h.key] = true; });
    var toSave = rows.filter(function (h) { return !have[h.key]; });
    if (toSave.length) {
      await idbBulkPut('paradeHistory', toSave);
      historyList = historyList.concat(toSave);
    }
    return { added: toSave.length, skipped: rows.length - toSave.length };
  }

          '<input type="text" id="backupReplaceConfirm" class="backup-confirm" placeholder="Type REPLACE" autocomplete="off" autocapitalize="characters">' +
          '<button class="btn full danger" id="btnBackupReplace" style="margin-bottom:8px;">' + (b.history.length ? 'REPLACE DATA + ADD HISTORY' : 'REPLACE DATA') + '</button>';

      }
      html += '<button class="btn ghost full" id="btnBackupCancel">CANCEL</button>';
    }
    html += '</div>';
    return html;
  }
  function bindBackupEvents() {
    var saveBtn = document.getElementById('btnBackupSave');
    if (saveBtn) saveBtn.addEventListener('click', async function () {
      try { shareOrDownloadJson_(backupFilename_(), await buildBackupJson_()); }
      catch (err) { console.log('[Backup] build failed:', err); showToast('Backup failed — ' + (err && err.message ? err.message : 'see console.')); }
    });
    var copyBtn = document.getElementById('btnBackupCopy');
    if (copyBtn) copyBtn.addEventListener('click', async function () {
      var text = await buildBackupJson_();
      try { await navigator.clipboard.writeText(text); showToast('Backup copied. Paste it somewhere safe.'); }
      catch (err) { showToast('Copy isn\'t available here — use SHARE / SAVE instead.'); }
    });
    var fileIn = document.getElementById('backupFile'), paste = document.getElementById('backupPaste');
    if (fileIn) fileIn.addEventListener('change', function () {
      var f = fileIn.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = function () { paste.value = reader.result; };
      reader.onerror = function () { showToast('Could not read that file.'); };
      reader.readAsText(f);
    });
    var readBtn = document.getElementById('btnBackupRead');
    if (readBtn) readBtn.addEventListener('click', function () {
      var text = (paste.value || '').trim();
      if (!text) { showToast('Pick a backup file or paste its text first.'); return; }
      var parsed = parseBackup_(text);
      if (parsed.error) { showToast(parsed.error); return; }
      backupImport = parsed;
      render();
    });
    var cancelBtn = document.getElementById('btnBackupCancel');
    if (cancelBtn) cancelBtn.addEventListener('click', function () { backupImport = null; render(); });
    var replaceBtn = document.getElementById('btnBackupReplace');
    if (replaceBtn) replaceBtn.addEventListener('click', async function () {
      var typed = (document.getElementById('backupReplaceConfirm').value || '').trim().toUpperCase();
      if (typed !== 'REPLACE') { showToast('Type REPLACE to confirm.'); return; }
      try {
        await applyBackupData_(backupImport.data);
        var h = await mergeBackupHistory_(backupImport.history);
        backupImport = null;
        render();
        showToast('Restored Data: ' + APP.employees.length + ' employees.' + (h.added || h.skipped ? ' History: ' + h.added + ' added, ' + h.skipped + ' already here.' : ''));
      } catch (err) {
        console.log('[Backup] restore failed:', err);
        showToast('Restore failed — ' + (err && err.message ? err.message : 'see console.'));
      }
    });
    var histBtn = document.getElementById('btnBackupHistoryOnly');
    if (histBtn) histBtn.addEventListener('click', async function () {
      try {
        var h = await mergeBackupHistory_(backupImport.history);
        backupImport = null;
        render();
        showToast('History: ' + h.added + ' added, ' + h.skipped + ' already here.');
      } catch (err) {
        console.log('[Backup] history merge failed:', err);
        showToast('Import failed — ' + (err && err.message ? err.message : 'see console.'));
      }
    });
  }

  function bindBulkModalEvents() {
    document.getElementById('modalOverlay').addEventListener('click', function (ev) { if (ev.target.id === 'modalOverlay') closeDataModal(); });
    document.getElementById('modalClose').addEventListener('click', closeDataModal);

    var parseBtn = document.getElementById('bulkParseBtn');
    if (parseBtn) parseBtn.addEventListener('click', function () {
      var text = document.getElementById('bulkTextarea').value;
      var names = text.split(/\r?\n|,/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
      var defaultRank = (bulkKind === 'employee' ? EMPLOYEE_RANKS : SUPERIOR_RANKS)[0];
      var defaultSubUnit = APP.subUnits.length ? APP.subUnits[0].name : '';
      bulkNames = names.map(function (n) { return { name: n, rank: defaultRank, subUnit: defaultSubUnit }; });
      renderBulkModal();
    });

    document.querySelectorAll('[data-bulk-rank]').forEach(function (sel) {
      sel.addEventListener('change', function () { bulkNames[+sel.getAttribute('data-bulk-rank')].rank = sel.value; });
    });

      if (h.session === 'STAYIN' && !historyShowStayIn) return false;

    }).sort(function (a, b) { return b.date.localeCompare(a.date) || b.session.localeCompare(a.session); });

  async function saveHistoryViewEdits_() {

    var h = historyList.filter(function (x) { return x.key === historyViewKey; })[0];
    if (!h) return;
    h.snapshot.people = historyViewPeople;
    h.snapshot.cds = historyViewMeta.cds;
    h.snapshot.cdo = historyViewMeta.cdo;
    h.snapshot.present = historyViewPeople.filter(function (p) { return p.bucket === 'In'; }).length;
    h.snapshot.total = historyViewPeople.length;
    h.savedAt = new Date().toISOString();
    try {
      await idbBulkPut('paradeHistory', [h]);
      historyViewDirty = false;
      historyViewEditMode = false;
      console.log('[History] Record updated:', historyViewKey);
      showToast('History record updated.');
      render();

      showToast('Save failed — ' + (err && err.message ? err.message : 'see Logcat/Console.'));
    }
  }
  async function deleteHistoryRecord_(key) {
    if (!confirm('Delete this saved record? This cannot be undone.')) return;
    try {
      await idbDelete('paradeHistory', key);
      var idx = historyList.findIndex(function (h) { return h.key === key; });
      if (idx >= 0) historyList.splice(idx, 1);
      console.log('[History] Record deleted:', key);
      showToast('Record deleted.');
      closeHistoryView();
    } catch (err) {
      console.log('[History] Delete FAILED:', err);
      showToast('Delete failed — ' + (err && err.message ? err.message : 'see Logcat/Console.'));
    }
  }

    var view = document.getElementById('view');
    var html;
    if (historyViewKey && mainTab === 'history') { html = historyViewHtml(); }
    else if (mainTab === 'parade') html = paradeHtml();
    else if (mainTab === 'history') html = historyHtml();
    else if (mainTab === 'backup') html = backupHtml();
    else if (mainTab === 'guide') html = guideHtml();
    else html = updateDataHtml();
    view.innerHTML = html;

    document.querySelectorAll('.maintab').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === mainTab); });

    if (historyViewKey && mainTab === 'history') bindHistoryViewEvents();
    else if (mainTab === 'parade') { if (session === 'STAYIN') bindStayInEvents(); else bindParadeEvents(); }
    else if (mainTab === 'history') bindHistoryEvents();
    else if (mainTab === 'backup') bindBackupEvents();
    else if (mainTab === 'guide') { /* static page */ }
    else bindUpdateDataEvents();
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.maintab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var newTab = btn.getAttribute('data-tab');
        mainTab = newTab;
        historyViewKey = null;
        recomputeAttendance_();
        window.scrollTo(0, 0);
        render();
      });
    });
    boot();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(function () {});
    }

    // ============ CAPACITOR OTA UPDATE CHECK ============
    // Only runs inside the native app built via Capacitor (see MOBILE_APP_GUIDE.md) —
    // window.Capacitor doesn't exist in a plain browser/PWA context, so this entire
    // block is a no-op there and never touches the GitHub Pages deployment.
    //
    // Checks a small update-manifest.json (hosted alongside this same page) for a
    // newer version than what's currently installed, downloads it quietly while the
    // app is in the foreground, and applies it the moment the app is backgrounded —
    // so it's never interrupting an active session, and the next time the app is
    // opened it's already the new version. Every step below shows a toast and logs
    // to console — nothing fails silently, so if it's not working, what you see
    // on screen (or in Logcat/Console via Android Studio/Xcode) says exactly why.
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater) {
      (function () {
        var Updater = window.Capacitor.Plugins.CapacitorUpdater;
        var AppPlugin = window.Capacitor.Plugins.App;
        var Preferences = window.Capacitor.Plugins.Preferences;
        // IMPORTANT: this must be an absolute URL, not a relative one. The app's web
        // content is bundled locally inside the APK/IPA, so a relative path like
        // './update-manifest.json' would resolve against that local bundle and just
        // re-read the stale, build-time copy forever — never seeing real updates.
        // Point this at wherever you actually host update-manifest.json (e.g. your
        // GitHub Pages repo root), and update it if that URL ever changes.
        var UPDATE_MANIFEST_URL = 'https://fro5tydog.github.io/Parade_State_App/update-manifest.json';
        var VERSION_KEY = 'ota_current_version';
        var pendingUpdate = null;

        console.log('[OTA] Updater plugin detected — initializing.');
        (Preferences ? Preferences.get({ key: VERSION_KEY }) : Promise.resolve(null)).then(function (res) {
          var current = (res && res.value) || '(none yet — first launch)';
          console.log('[OTA] Current applied version at this boot:', current);
          showToast('App version: ' + current);
        });

        Updater.notifyAppReady()
          .then(function () { console.log('[OTA] notifyAppReady OK.'); })
          .catch(function (err) { console.log('[OTA] notifyAppReady FAILED:', err); });

        function checkForUpdate() {
          console.log('[OTA] Checking', UPDATE_MANIFEST_URL);
          fetch(UPDATE_MANIFEST_URL, { cache: 'no-store' })
            .then(function (r) {
              console.log('[OTA] Manifest fetch HTTP status:', r.status);
              if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching manifest');
              return r.json();
            })
            .then(function (manifest) {
              console.log('[OTA] Manifest:', JSON.stringify(manifest));
              return (Preferences ? Preferences.get({ key: VERSION_KEY }) : Promise.resolve(null)).then(function (res) {
                var current = (res && res.value) || '0.0.0';
                console.log('[OTA] Installed version:', current, '| Manifest version:', manifest.version);
                if (manifest.version && manifest.version !== current) {
                  showToast('Downloading latest version (v' + manifest.version + ')...');
                  return Updater.download({ version: manifest.version, url: manifest.url })
                    .then(function (data) {
                      console.log('[OTA] Download OK:', JSON.stringify(data));
                      pendingUpdate = { data: data, version: manifest.version };
                      showToast('Latest version downloaded (v' + manifest.version + ') — will finish applying once you leave the app.');
                    })
                    .catch(function (err) {
                      console.log('[OTA] Download FAILED:', err);
                      showToast('Update download failed — see Logcat/Console.');
                    });
                } else {
                  console.log('[OTA] Already on latest version — nothing to do.');
                  showToast('App fully up to date (v' + current + ').');
                }
              });
            })
            .catch(function (err) {
              console.log('[OTA] Update check FAILED:', err);
              showToast('Update check failed: ' + (err && err.message ? err.message : err));
            });
        }

        if (AppPlugin) {
          AppPlugin.addListener('appStateChange', function (state) {
            console.log('[OTA] appStateChange — isActive:', state.isActive);
            if (state.isActive) {
              checkForUpdate();
            } else if (pendingUpdate) {
              var toApply = pendingUpdate;
              pendingUpdate = null;
              console.log('[OTA] Backgrounded with a pending update — applying', toApply.version);
              Updater.set(toApply.data)
                .then(function () {
                  console.log('[OTA] Applied. Now on version', toApply.version);
                  return Preferences && Preferences.set({ key: VERSION_KEY, value: toApply.version });
                })
                .catch(function (err) { console.log('[OTA] Apply FAILED:', err); });
            }
          });
        }

        checkForUpdate(); // also check once right at cold start
      })();
    } else {
      // This branch firing means the updater never even starts — almost always
      // a plugin-registration issue, not a network/manifest issue. Check exactly
      // which piece is missing:
      var hasCapacitor = !!window.Capacitor;
      var hasPlugins = hasCapacitor && !!window.Capacitor.Plugins;
      var hasUpdater = hasPlugins && !!window.Capacitor.Plugins.CapacitorUpdater;
      console.log('[OTA] Updater NOT available — window.Capacitor:', hasCapacitor, '| .Plugins:', hasPlugins, '| .Plugins.CapacitorUpdater:', hasUpdater);
      if (hasCapacitor) {
        // Only show this one visibly — if window.Capacitor itself is missing this
        // isn't even running inside Capacitor at all (e.g. a plain browser), which
        // isn't worth alarming over.
        showToast('OTA updater plugin not found — check Logcat/Console for [OTA] logs.');
      }
    }
  });
</script>
</body>
</html>
